<!DOCTYPE html>
<html lang="en" class="app page-quiz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes | Himaayah Schools</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#094570">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/i18n.js"></script>
</head>
<body>
<header class="top"><div>
<a class="brand" href="index.html"><svg width="22" height="27" viewBox="0 0 377.21 459.6" fill="#094570" aria-hidden="true"><path d="M0.14 280.14c4.28,65.12 98.42,133.97 163.39,172.42 15.86,9.39 34.24,9.39 50.11,-0.01 52.97,-31.37 159.02,-102.63 163.43,-172.41l-376.92 0zm302.67 -162.41l74.4 105.8 0 -126.48c0,-20.52 -11.85,-38.03 -30.9,-45.66l-125.46 -50.22 81.96 116.56zm-228.42 0l82.79 -117.73 -126.49 51.28c-18.95,7.68 -30.7,25.13 -30.7,45.57l0 126.67 74.4 -105.8zm114.21 -8.75c35.22,0 63.77,28.55 63.77,63.77 0,35.22 -28.55,63.77 -63.77,63.77 -35.22,0 -63.77,-28.55 -63.77,-63.77 0,-35.22 28.55,-63.77 63.77,-63.77z"/></svg>Himaayah Schools <em>Quizzes</em></a>
<nav><a class="btn btn-line btn-sm" href="dashboard.html">My dashboard</a><button class="btn btn-ink btn-sm" id="out" hidden>Log out</button></nav>
</div></header>

<main id="login" class="login"><form class="lbox" id="lf" novalidate>
<div class="crest" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#094570" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5V5h6V3.5"/><path d="M9 11l2 2 4-4"/><path d="M9 17h6"/></svg></div>
<span class="kick">Students</span><h1>Practice quizzes</h1><p>Short quizzes marked for you straight away. Sign in with your Student ID and access code.</p>
<div class="demo" id="demoNote" hidden><b>Demo mode.</b> Use ID <b>DEMO</b> and code <b>demo</b> to try it.</div>
<div class="f"><label for="sid">Student ID</label><input id="sid" autocomplete="username" autocapitalize="characters" required></div>
<div class="f"><label for="scode">Access code</label><input id="scode" type="password" autocomplete="current-password" required></div>
<div class="err" id="err" role="alert"></div><button class="btn btn-ink" id="go" type="submit">Sign in</button>
<div class="lnote">Signed in on your dashboard already? You'll go straight in.</div>
</form></main>

<main id="app" class="wrap" hidden></main>

<script>
/* The Apps Script web-app URL. It must be the SAME address your dashboard.html uses. While empty, the page runs in DEMO mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arCls = (t) => (/^[\u0600-\u06FF\s]{1,6}$/.test(String(t)) ? ' ar' : '');
const ST = { id: '', code: '', student: null, quizzes: [], quiz: null, qs: [], i: 0, ans: {}, result: null, busy: false };

/* ---- demo (only while API_URL is empty) ---- */
const DQ = [{ id: '1', question: 'How many letters are in the Arabic alphabet?', options: [{k:'A',t:'26'},{k:'B',t:'28'},{k:'C',t:'30'},{k:'D',t:'32'}], correct: 'B', explanation: 'The standard alphabet has 28 letters.' },
  { id: '2', question: 'Which letter has two dots above it?', options: [{k:'A',t:'ب'},{k:'B',t:'ت'},{k:'C',t:'ث'},{k:'D',t:'ن'}], correct: 'B', explanation: 'ت (taa) has two dots above.' }];
async function api(body) {
  if (!API_URL) {
    await new Promise((r) => setTimeout(r, 250));
    if (body.id.toUpperCase() !== 'DEMO' || body.code !== 'demo') return { ok: false, error: 'Wrong ID or access code.' };
    const stu = { name: 'Sample Student', level: 'Rawdah' };
    if (body.op === 'start') return { ok: true, quiz: { QuizID: 'DEMO', Title: 'Arabic letters (demo)', PassMark: 70 }, questions: DQ.map(({ id, question, options }) => ({ id, question, options })) };
    if (body.op === 'submit') { const review = DQ.map((q) => ({ id: q.id, question: q.question, options: q.options, yours: (body.answers[q.id] || ''), correct: q.correct, ok: body.answers[q.id] === q.correct, explanation: q.explanation })); const score = review.filter((x) => x.ok).length; return { ok: true, score, outOf: DQ.length, percent: Math.round(score / DQ.length * 100), passed: score / DQ.length >= .7, passMark: 70, saved: true, review }; }
    return { ok: true, student: stu, quizzes: [{ QuizID: 'DEMO', Title: 'Arabic letters (demo)', Subject: 'Arabic', Description: 'Two sample questions so you can see how it works.', Questions: 2, PassMark: 70, Attempts: 0, Best: null }] };
  }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'quiz', id: ST.id, code: ST.code }, body)) });
  return r.json();
}
const call = (body) => api(Object.assign({ id: ST.id, code: ST.code }, body));

/* ---- views ---- */
function listView() {
  const q = ST.quizzes;
  $('app').innerHTML = `<section class="hero"><small>Assalaamu alaykum</small><h1>${esc(String(ST.student.name).split(' ')[0])}, test what you know.</h1>
    <p>Pick a quiz for <b>${esc(ST.student.level || 'your level')}</b>. You see your score at once, and your best score is saved for your teachers.</p></section>
    ${q.length ? `<div class="grid">${q.map((x, i) => `<article class="item" style="--i:${Math.min(i, 10)}"><div><span class="pill t">${esc(x.Subject)}</span> ${x.Best && x.Best.percent >= x.PassMark ? '<span class="pill ok">Passed</span>' : ''}</div>
      <h3>${esc(x.Title)}</h3><p>${esc(x.Description)}</p>
      <div class="foot"><span>${x.Questions} question${x.Questions === 1 ? '' : 's'}${x.Best ? ` &middot; best ${x.Best.score}/${x.Best.outOf}` : ''}</span><button class="btn btn-ink btn-sm" data-start="${esc(x.QuizID)}">${x.Attempts ? 'Try again' : 'Start'}</button></div></article>`).join('')}</div>`
      : '<div class="empty">No quizzes for your level yet. Please check again soon.</div>'}
    <div class="msg" id="msg" role="alert"></div>`;
}
function qView() {
  const q = ST.qs[ST.i], n = ST.qs.length, last = ST.i === n - 1, answered = Object.keys(ST.ans).length;
  $('app').innerHTML = `<section class="q"><div class="pmeta"><b>${esc(ST.quiz.Title)}</b><span>Question ${ST.i + 1} of ${n}</span></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${ST.i + 1}"><i style="width:${(ST.i + 1) / n * 100}%"></i></div>
    <h2 id="qt">${esc(q.question)}</h2>
    <div role="radiogroup" aria-labelledby="qt">${q.options.map((o) => `<button class="opt" role="radio" aria-checked="${ST.ans[q.id] === o.k}" data-k="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span class="tx${arCls(o.t)}">${esc(o.t)}</span></button>`).join('')}</div>
    <div class="nav"><button class="btn btn-line" data-back ${ST.i === 0 ? 'disabled' : ''}>Back</button>
      ${last ? `<button class="btn btn-ink" data-submit ${ST.busy ? 'disabled' : ''}>${ST.busy ? 'Marking…' : 'Submit (' + answered + ' of ' + n + ' answered)'}</button>` : `<button class="btn btn-ink" data-next ${ST.ans[q.id] ? '' : 'disabled'}>Next</button>`}</div>
    <div class="msg" id="msg" role="alert"></div></section>`;
}
function resultView() {
  const r = ST.result, c = r.passed ? 'var(--ok)' : 'var(--sky-d)';
  $('app').innerHTML = `<section class="score"><div class="ring" style="--p:${r.percent};--c:${c}"><div>${r.score}/${r.outOf}</div></div><div>
    <h2>${r.passed ? 'Mashaa Allah, well done!' : 'Good effort. Keep practising.'}</h2>
    <p>You scored ${r.percent}%. The pass mark is ${r.passMark}%.${r.saved ? ' Your best score is saved.' : ' You have used today&rsquo;s saved attempts for this quiz, so this one was not recorded.'}</p>
    <button class="btn btn-ink" data-start="${esc(ST.quiz.QuizID)}">Try again</button> <button class="btn btn-line" data-list>All quizzes</button></div></section>
    ${r.review.map((x, i) => `<section class="rev"><h3>${i + 1}. ${esc(x.question)}</h3>${x.options.map((o) => `<div class="opt static ${o.k === x.correct ? 'good' : o.k === x.yours ? 'wrong' : ''}"><span class="k">${esc(o.k)}</span><span class="tx${arCls(o.t)}">${esc(o.t)}</span></div>`).join('')}
      ${x.yours ? '' : '<div class="ex">You did not answer this one.</div>'}${x.explanation ? `<div class="ex">${esc(x.explanation)}</div>` : ''}</section>`).join('')}
    <p class="foot2">Answers are shown after you submit.</p>`;
  window.scrollTo(0, 0);
}

async function loadList() {
  const d = await call({ op: 'list' });
  if (!d.ok) { return fail(d.error); }
  ST.student = d.student; ST.quizzes = d.quizzes; ST.quiz = null; ST.result = null; listView();
}
function fail(m) { const el = $('msg'); if (el) el.textContent = m || 'Something went wrong. Please try again.'; }
document.addEventListener('click', async (e) => {
  if (!ST.student) return;
  const s = e.target.closest('[data-start]'), k = e.target.closest('[data-k]');
  if (s) {
    s.disabled = true;
    try { const d = await call({ op: 'start', quizId: s.dataset.start }); if (!d.ok) { s.disabled = false; return fail(d.error); } Object.assign(ST, { quiz: d.quiz, qs: d.questions, i: 0, ans: {}, result: null }); qView(); window.scrollTo(0, 0); }
    catch (x) { s.disabled = false; fail('Could not reach the school server. Please try again.'); }
  } else if (k && ST.qs.length) { ST.ans[ST.qs[ST.i].id] = k.dataset.k; qView(); }
  else if (e.target.closest('[data-next]')) { ST.i++; qView(); }
  else if (e.target.closest('[data-back]')) { ST.i--; qView(); }
  else if (e.target.closest('[data-list]')) { loadList(); }
  else if (e.target.closest('[data-submit]') && !ST.busy) {
    ST.busy = true; qView();
    try { const d = await call({ op: 'submit', quizId: ST.quiz.QuizID, answers: ST.ans }); ST.busy = false; if (!d.ok) { qView(); return fail(d.error); } ST.result = d; resultView(); }
    catch (x) { ST.busy = false; qView(); fail('Could not reach the school server. Please try again.'); }
  }
});

/* ---- sign in (shares the dashboard's session) ---- */
async function signIn(id, code, silent) {
  const b = $('go'); $('err').textContent = ''; b.disabled = true; b.textContent = 'Signing in…'; ST.id = id; ST.code = code;
  try {
    const d = await call({ op: 'list' });
    if (d.ok) { sessionStorage.setItem('hs', JSON.stringify({ id, code })); $('login').hidden = true; $('app').hidden = false; $('out').hidden = false; ST.student = d.student; ST.quizzes = d.quizzes; listView(); window.scrollTo(0, 0); }
    else if (!silent) $('err').textContent = d.error || 'Could not sign in.'; else sessionStorage.removeItem('hs');
  } catch (x) { if (!silent) $('err').textContent = 'Could not reach the school server. Please try again.'; }
  b.disabled = false; b.textContent = 'Sign in';
}
$('demoNote').hidden = !!API_URL;
$('lf').addEventListener('submit', (e) => { e.preventDefault(); const i = $('sid').value.trim(), c = $('scode').value.trim(); if (!i || !c) { $('err').textContent = 'Enter your Student ID and access code.'; return; } signIn(i, c); });
$('out').addEventListener('click', () => { sessionStorage.removeItem('hs'); location.reload(); });
try { const s = JSON.parse(sessionStorage.getItem('hs') || 'null'); if (s && s.id && s.code) signIn(s.id, s.code, true); } catch (x) {}
</script>
</body>
</html>
