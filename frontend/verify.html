<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check a card | Himaayah Schools</title>
<meta name="description" content="Check that a Himaayah Schools library card or ID card is valid.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#062F4D">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --deep: #062F4D; --ink: #094570; --wash: #EEF6FC; --muted: #3D5568; --line: #D6E3EE; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; color: #0E2A3D; background: var(--wash); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--deep); text-decoration: none; margin-bottom: 20px; }
.brand img { width: 36px; height: 36px; border-radius: 9px; }
.box { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; }
.mark { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
.ok .mark { background: #DDF3E4; color: #1B6B3A; } .no .mark { background: #FBE3E3; color: #A4262C; } .wait .mark { background: #D6EBFA; color: var(--ink); }
h1 { font: 700 26px/1.15 'Fraunces', serif; color: var(--deep); margin: 0 0 8px; }
p { margin: 0; color: var(--muted); }
dl { margin: 20px 0 0; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; border-top: 1px solid var(--line); padding-top: 16px; }
dt { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); align-self: center; }
dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
small { display: block; margin-top: 18px; color: var(--muted); font-size: 12px; }
a.back { margin-top: 18px; color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<a class="brand" href="./"><img src="logo.png" alt="">Himaayah Schools</a>
<main class="box wait" id="box" aria-live="polite">
<div class="mark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<h1 id="h">Checking the card…</h1>
<p id="p">One moment.</p>
<dl id="dl" hidden></dl>
<small>This page only confirms a card. It never shows contact details, fees or results.</small>
</main>
<a class="back" href="./">Himaayah Schools home</a>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const ICON = {
  ok: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  no: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function state(cls, h, p) { $('box').className = 'box ' + cls; $('h').textContent = h; $('p').textContent = p; if (ICON[cls]) document.querySelector('.mark').innerHTML = ICON[cls]; }
function row(k, v) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; $('dl').append(dt, dd); }
(async () => {
  const id = (q.get('c') || '').trim(), k = (q.get('k') || '').trim();
  if (!id || !k) { state('no', 'No card to check', 'Scan the QR code on a Himaayah Schools card.'); return; }
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cards', op: 'verify', id, check: k }) });
    const j = await r.json();
    if (!j || !j.ok) { state('no', 'Could not check', (j && j.error) || 'Please try again in a minute.'); return; }
    if (!j.name) { state('no', 'Card not recognised', 'This card is not valid. Please contact the school.'); return; }
    if (!j.valid) { state('no', 'Card not active', 'This card is recognised but its plan is due for renewal.'); }
    else state('ok', 'Valid card', 'This is a genuine Himaayah Schools card.');
    row('Name', j.name); row('Type', j.kind === 'staff' ? 'Staff' : 'Student'); row('Programme', j.programme); row('Library no.', j.libraryNo);
    $('dl').hidden = false;
  } catch (e) { state('no', 'Could not check', 'The school server could not be reached. Please try again.'); }
})();
</script>
</body>
</html>
