<div class="crest" aria-hidden="true"><svg width="26" height="32" viewBox="0 0 377.21 459.6" fill="#094570"><path d="M0.14 280.14c4.28,65.12 98.42,133.97 163.39,172.42 15.86,9.39 34.24,9.39 50.11,-0.01 52.97,-31.37 159.02,-102.63 163.43,-172.41l-376.92 0zm302.67 -162.41l74.4 105.8 0 -126.48c0,-20.52 -11.85,-38.03 -30.9,-45.66l-125.46 -50.22 81.96 116.56zm-228.42 0l82.79 -117.73 -126.49 51.28c-18.95,7.68 -30.7,25.13 -30.7,45.57l0 126.67 74.4 -105.8zm114.21 -8.75c35.22,0 63.77,28.55 63.77,63.77 0,35.22 -28.55,63.77 -63.77,63.77 -35.22,0 -63.77,-28.55 -63.77,-63.77 0,-35.22 28.55,-63.77 63.77,-63.77z"/></svg></div>
<span class="kick">Academy</span><h1>Admin login</h1><p>Sign in with your Admin ID and access code.</p>
<div class="demo" id="demoNote" hidden><b>Demo mode.</b> Use ID <b>DEMO</b> and code <b>demo</b> to try it with sample data.</div>
<div class="f"><label for="tid">Admin ID</label><input id="tid" autocomplete="username" autocapitalize="characters" placeholder="e.g. AA-001" required></div>
<div class="f"><label for="tcode">Access code</label><input id="tcode" type="password" autocomplete="new-password" data-lpignore="true" required></div>
<div class="err" id="err" role="alert"></div>
<button class="btn btn-ink" id="go" type="submit">Sign in</button>
</form></main>

<main id="app" class="wrap" hidden></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===== SETTINGS ===== Same Apps Script web app as the other portals. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';
const KEY = 'hca';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
const fdate = (iso, t) => { const d = new Date(iso); return isNaN(d) ? esc(iso || 'Not set') : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + (t ? ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : ''); };
const pct = (x) => x == null ? '–' : x + '%';
const num = (x) => x == null ? '–' : x;
const plural = (n, w) => n + ' ' + (n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : /(s|sh|ch|x)$/.test(w) ? w + 'es' : w + 's');
const TABS = [['reports', 'Reports'], ['students', 'Students'], ['mentors', 'Mentors'], ['families', 'Families'], ['assign', 'Assign'], ['groups', 'Class groups'], ['payments', 'Payments'], ['account', 'Account']];
let D = null;
const S = { tab: 'reports', q: '', filter: 'all', sel: {}, open: {}, created: null, addOpen: false };

/* ---------- talking to the school server ---------- */
const creds = () => { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null') || {}; } catch (e) { return {}; } };
async function api(action, extra) {
  const c = creds();
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, id: c.id, code: c.code }, extra || {})) });
  return r.json();
}
let toastT;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3000); }
let busy = false;
async function act(action, extra, okMsg, btn) {
  if (busy) return false;
  busy = true; const old = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const d = await api(action, extra);
    if (d.ok) { D = d; S.created = d.created || null; if (okMsg) toast(okMsg); render(); return true; }
    toast(d.error || 'Could not save. Please try again.', true);
  } catch (e) { toast('Could not reach the school server. Please try again.', true); }
  finally { busy = false; if (btn && document.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
  return false;
}

/* ---------- helpers ---------- */
const PCLS = { Paid: 'p-ink', Exempt: 'p-wash', Overdue: 'p-red', Due: 'p-sky' };
const payPill = (s) => `<span class="pill ${PCLS[s.PaymentStatus] || 'p-sky'}">${esc(s.PaymentStatus || 'Due')}</span>`;
const stuName = (id) => (D.students.find((s) => s.StudentID === id) || {}).Name || id;
const opts = (list, first, sel) => (first != null ? `<option value="">${esc(first)}</option>` : '') + list.map((x) => `<option value="${esc(x.v)}"${x.v === sel ? ' selected' : ''}>${esc(x.t)}</option>`).join('');
const count = (fn) => D.students.filter(fn).length;
const mentorOpts = (sel) => opts(D.teachers.map((t) => ({ v: t.TeacherID, t: t.Name })), 'No mentor yet', sel);
const groupOpts = (sel) => opts(D.levels.map((l) => ({ v: l, t: l })), 'No class group yet', sel);
const trackOpts = (sel) => opts(D.tracks.map((t) => ({ v: t, t })), null, sel || 'UTME');
function createdBox() {
  const c = S.created; if (!c) return '';
  return `<div class="acx-cred" role="status"><b>${c.reset ? 'New access code for' : c.kind === 'mentor' ? 'Mentor added:' : 'Student added:'} ${esc(c.name)}</b>
    <div class="acx-cred-r"><span>ID</span><code translate="no">${esc(c.id)}</code></div><div class="acx-cred-r"><span>Access code</span><code translate="no">${esc(c.code)}</code></div>
    <p class="sub">${c.emailed === 'Emailed' ? 'The login details were emailed to them.' : c.emailed ? 'Not emailed: ' + esc(c.emailed.toLowerCase()) + '.' : 'Copy these now and send them privately. The code is not shown again.'}</p>
    <div class="acx-acts"><button class="btn btn-line btn-sm" type="button" data-act="copyCred">Copy login details</button><button class="btn btn-line btn-sm" type="button" data-act="hideCred">Done</button></div></div>`;
}

/* ---------- reports ---------- */
function bars(trend, key, label) {
  const vals = trend.map((w) => w[key]);
  return `<div class="acx-bars" role="img" aria-label="${esc(label)} by week">${trend.map((w) => `<div><i style="height:${w[key] == null ? 0 : Math.max(3, w[key])}%"></i><em>${w[key] == null ? '' : Math.round(w[key])}</em><span>${new Date(w.Week).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span></div>`).join('')}</div>${vals.every((v) => v == null) ? '<p class="empty">No records in the last 8 weeks.</p>' : ''}`;
}
function table(rows, first) {
  if (!rows.length) return '<p class="empty">Nothing to show yet.</p>';
  return `<div class="acx-scroll"><table><thead><tr><th>${first}</th><th>Students</th><th>Overall</th><th>Mocks</th><th>Attendance</th><th>Tasks</th><th>Reading</th><th>Overdue</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${r.students}</td><td>${num(r.overall)}</td><td>${pct(r.mocks)}</td><td>${pct(r.attendance)}</td><td>${pct(r.tasks)}</td><td>${pct(r.reading)}</td><td>${r.overdue}</td></tr>`).join('')}</tbody></table></div>`;
}
function vReports() {
  const R = D.reports;
  return `<div class="grid">
    <article class="c w12"><h2>Academy at a glance</h2><p class="sub">Scores cover the last ${R.days} days for active students.</p>
      <div class="tiles acx-tiles6"><div class="tile"><b>${R.students}</b><span>active students</span></div><div class="tile"><b>${num(R.overall)}</b><span>average overall</span></div><div class="tile"><b>${pct(R.mocks)}</b><span>average mocks</span></div><div class="tile"><b>${pct(R.attendance)}</b><span>attendance</span></div><div class="tile"><b>${pct(R.tasks)}</b><span>task scores</span></div><div class="tile ${R.overdue ? 'warn' : ''}"><b>${R.overdue}</b><span>fees overdue</span></div></div>
      <p class="sub">${plural(R.taskSubs30, 'task submission')} and ${plural(R.cbtAttempts30, 'CBT attempt')} in the last 30 days · ${R.paid} paid up, ${R.due} due soon.</p>
      <div class="acx-acts"><button class="btn btn-ink btn-sm" type="button" data-act="csv">Download student report (CSV)</button><button class="btn btn-line btn-sm" type="button" data-act="print">Print</button></div></article>
    <article class="c w6"><h2>Mock average by week</h2>${bars(R.trend, 'Mocks', 'Mock average')}</article>
    <article class="c w6"><h2>Attendance by week</h2>${bars(R.trend, 'Attendance', 'Attendance')}</article>
    <article class="c w12"><h2>By class group</h2>${table(R.byGroup, 'Group')}</article>
    <article class="c w6"><h2>By mentor</h2>${table(R.byTutor, 'Mentor')}</article>
    <article class="c w6"><h2>By track</h2>${table(R.byTrack, 'Track')}</article>
    <article class="c w12"><h2>Students who need attention</h2><p class="sub">Overall score under 50, or attendance under 60%.</p>${R.atRisk.length ? `<div class="acx-scroll"><table><thead><tr><th>Student</th><th>Group</th><th>Mentor</th><th>Overall</th><th>Attendance</th><th></th></tr></thead><tbody>${R.atRisk.map((s) => `<tr><td><b>${esc(s.Name)}</b><br><span class="sub">${esc(s.StudentID)}</span></td><td>${esc(s.Group || '–')}</td><td>${esc(s.Teacher || '–')}</td><td>${num(s.Overall)}</td><td>${pct(s.Attendance)}</td><td><button class="btn btn-line btn-sm" type="button" data-act="view" data-id="${esc(s.StudentID)}">Open</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Nobody at the moment.</p>'}</article>
  </div>`;
}
function csv() {
  const head = ['StudentID', 'Matric', 'Name', 'Track', 'Group', 'Mentor', 'Rank', 'Overall', 'Mocks %', 'Mock sittings', 'Attendance %', 'Classes', 'Tasks %', 'Tasks submitted', 'Tasks set', 'CBT practice %', 'Reading %', 'Payment', 'Next due', 'Email', 'WhatsApp'];
  const q = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) || /^[=+\-@]/.test(s) ? '"' + s.replace(/"/g, '""').replace(/^([=+\-@])/, "'$1") + '"' : s; };
  const rows = D.students.map((s) => { const m = s.Metrics || {}; return [s.StudentID, s.Matric, s.Name, s.Plan, s.Level, s.Teacher, s.Rank, m.overall, m.mocks, m.mockCount, m.attendance, m.sessions, m.tasks, m.tasksDone, m.tasksSet, m.cbt, m.reading, s.PaymentStatus, s.NextDue, s.Email, s.WhatsApp]; });
  const blob = new Blob(['﻿' + [head].concat(rows).map((r) => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'academy-report-' + D.today + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- students ---------- */
function studentForm(s, id) {
  s = s || {};
  return `<form class="frm" data-form="student" data-id="${esc(s.StudentID || '')}">
    <div class="row2"><div><label class="fl" for="${id}n">Full name</label><input class="in" id="${id}n" name="name" maxlength="100" value="${esc(s.Name)}" required></div><div><label class="fl" for="${id}m">Matric number <small>(optional)</small></label><input class="in" id="${id}m" name="matric" maxlength="40" value="${esc(s.Matric)}" placeholder="e.g. HMA/24/001"></div></div>
    <div class="row3"><div><label class="fl" for="${id}t">Track</label><select class="in" id="${id}t" name="track">${trackOpts(s.Plan)}</select></div><div><label class="fl" for="${id}g">Class group</label><select class="in" id="${id}g" name="group">${groupOpts(s.Level)}</select></div><div><label class="fl" for="${id}r">Mentor</label><select class="in" id="${id}r" name="tutorId">${mentorOpts(s.TeacherID)}</select></div></div>
    <div class="row2"><div><label class="fl" for="${id}e">Email</label><input class="in" id="${id}e" name="email" type="email" maxlength="200" value="${esc(s.Email)}"></div><div><label class="fl" for="${id}w">WhatsApp</label><input class="in" id="${id}w" name="whatsapp" maxlength="30" value="${esc(s.WhatsApp)}"></div></div>
    <div class="row3"><div><label class="fl" for="${id}f">Monthly fee (₦)</label><input class="in" id="${id}f" name="monthlyFee" type="number" min="0" step="any" value="${esc(s.MonthlyFee || '')}"></div><div><label class="fl" for="${id}d">Next payment due</label><input class="in" id="${id}d" name="nextDue" type="date" value="${esc(s.NextDue)}"></div><div><label class="fl" for="${id}x">Exam date</label><input class="in" id="${id}x" name="examDate" type="date" value="${esc(s.ExamDate)}"></div></div>
    ${s.StudentID ? '' : `<label class="acx-check"><input type="checkbox" name="sendEmail" checked> Email the login details to the student</label>`}
    <button class="btn btn-ink" type="submit">${s.StudentID ? 'Save changes' : 'Add student'}</button></form>`;
}
function vStudents() {
  const row = (s) => { const m = s.Metrics || {};
    return `<details class="box stu" data-k="s-${esc(s.StudentID)}" data-name="${esc((s.Name + ' ' + s.StudentID + ' ' + s.Matric).toLowerCase())}"${S.open['s-' + s.StudentID] ? ' open' : ''}>
    <summary><div><b>${esc(s.Name)}</b><small>${esc(s.StudentID)}${s.Matric ? ' · ' + esc(s.Matric) : ''} · ${esc(s.Plan || '')}${s.Level ? ' · ' + esc(s.Level) : ''} · ${esc(s.Teacher || 'No mentor')}</small></div><div class="sum-r">${s.Rank ? `<span class="pill p-wash">Rank ${s.Rank}</span>` : ''}${payPill(s)}</div></summary>
    <div class="body"><p class="sub">Overall ${num(m.overall)} · mocks ${pct(m.mocks)} · attendance ${pct(m.attendance)} · tasks ${pct(m.tasks)} · enrolled ${fdate(s.Enrolled)}</p>
      ${studentForm(s, 'e' + s.StudentID.replace(/\W/g, ''))}
      <div class="acx-acts"><button class="btn btn-line btn-sm" type="button" data-act="view" data-id="${esc(s.StudentID)}">Open dashboard</button><button class="btn btn-line btn-sm" type="button" data-act="code" data-id="${esc(s.StudentID)}">New access code</button><button class="btn btn-line btn-sm acx-danger" type="button" data-act="remove" data-id="${esc(s.StudentID)}">Remove</button></div></div></details>`; };
  return `<div class="grid"><article class="c w12"><h2>Students</h2>${createdBox()}
    <details class="box acx-add"${S.addOpen ? ' open' : ''} data-k="add"><summary><div><b>Add a student</b><small>Gets a Student ID and access code straight away. Website enrolments are added automatically.</small></div></summary><div class="body">${studentForm(null, 'new')}</div></details>
    <input class="in" id="q" type="search" placeholder="Search by name, ID or matric number" value="${esc(S.q)}" style="max-width:360px;margin-top:16px">
    <div id="stulist">${D.students.map(row).join('') || '<p class="empty" style="margin-top:12px">No students yet.</p>'}</div>
    ${D.removed.length ? `<p class="k" style="margin-top:24px">Removed students</p><ul class="list">${D.removed.map((s) => `<li><span><b>${esc(s.Name)}</b> <span class="sub">${esc(s.StudentID)} · ${esc(s.Plan || '')}</span></span><button type="button" data-act="restore" data-id="${esc(s.StudentID)}">Restore</button></li>`).join('')}</ul><p class="sub">Removed students cannot sign in and do not appear in lists or reports. Their records are kept.</p>` : ''}</article></div>`;
}

/* ---------- mentors ---------- */
function mentorForm(t, id) {
  t = t || {};
  return `<form class="frm" data-form="mentor" data-id="${esc(t.TutorID || '')}"><div class="row2"><div><label class="fl" for="${id}n">Name</label><input class="in" id="${id}n" name="name" maxlength="100" value="${esc(t.Name)}" required></div><div><label class="fl" for="${id}r">Role</label><select class="in" id="${id}r" name="role"><option value="Tutor"${t.Role !== 'Admin' ? ' selected' : ''}>Mentor (own mentees)</option><option value="Admin"${t.Role === 'Admin' ? ' selected' : ''}>Lead mentor (all students)</option></select></div></div>
    <div class="row2"><div><label class="fl" for="${id}e">Email</label><input class="in" id="${id}e" name="email" type="email" maxlength="200" value="${esc(t.Email)}"></div><div><label class="fl" for="${id}w">WhatsApp</label><input class="in" id="${id}w" name="whatsapp" maxlength="30" value="${esc(t.WhatsApp)}"></div></div>
    ${t.TutorID ? '' : `<label class="acx-check"><input type="checkbox" name="sendEmail" checked> Email the login details to the mentor</label>`}
    <button class="btn btn-ink" type="submit">${t.TutorID ? 'Save changes' : 'Add mentor'}</button></form>`;
}
function vMentors() {
  const act_ = D.tutors.filter((t) => t.Active), gone = D.tutors.filter((t) => !t.Active);
  return `<div class="grid"><article class="c w12"><h2>Mentors</h2>${createdBox()}
    <details class="box acx-add" data-k="addm"${S.open.addm ? ' open' : ''}><summary><div><b>Add a mentor</b><small>They sign in at academy-tutor.html with the ID and code shown after saving.</small></div></summary><div class="body">${mentorForm(null, 'nm')}</div></details>
    ${act_.map((t) => `<details class="box stu" data-k="m-${esc(t.TutorID)}"${S.open['m-' + t.TutorID] ? ' open' : ''}><summary><div><b>${esc(t.Name)}</b><small>${esc(t.TutorID)} · ${t.Role === 'Admin' ? 'Lead mentor' : 'Mentor'} · ${plural(t.Students, 'mentee')}</small></div></summary>
      <div class="body">${mentorForm(t, 'm' + t.TutorID.replace(/\W/g, ''))}<div class="acx-acts"><button class="btn btn-line btn-sm" type="button" data-act="mcode" data-id="${esc(t.TutorID)}">New access code</button><button class="btn btn-line btn-sm acx-danger" type="button" data-act="mremove" data-id="${esc(t.TutorID)}">Remove</button></div></div></details>`).join('') || '<p class="empty" style="margin-top:12px">No mentors yet.</p>'}
    ${gone.length ? `<p class="k" style="margin-top:24px">Removed mentors</p><ul class="list">${gone.map((t) => `<li><span><b>${esc(t.Name)}</b> <span class="sub">${esc(t.TutorID)}</span></span><button type="button" data-act="mrestore" data-id="${esc(t.TutorID)}">Restore</button></li>`).join('')}</ul>` : ''}</article></div>`;
}

/* ---------- assign ---------- */
function vAssign() {
  const f = S.filter;
  const shown = D.students.filter((s) => f === 'all' || (f === 'noFac' && !s.TeacherID) || (f === 'noGroup' && !s.Level) || (f === 'noFam' && !s.Family));
  const famName = (id) => ((D.families || []).find((x) => x.FamilyID === id) || {}).Name || '';
  const load = D.teachers.map((t) => ({ t, n: count((s) => s.TeacherID === t.TeacherID) }));
  return `<div class="grid"><article class="c w8"><h2>Assign mentees</h2><p class="sub">Tick the students, then choose a mentor, class group or family on the right. Anything left on “No change” is untouched.</p>
    <div class="tiles"><div class="tile"><b>${D.students.length}</b><span>students</span></div><div class="tile ${count((s) => !s.TeacherID) ? 'warn' : ''}"><b>${count((s) => !s.TeacherID)}</b><span>no mentor yet</span></div><div class="tile ${count((s) => !s.Level) ? 'warn' : ''}"><b>${count((s) => !s.Level)}</b><span>no class group yet</span></div></div>
    <div class="tool"><div><label class="fl" for="q">Search</label><input class="in" id="q" type="search" placeholder="Name or ID" value="${esc(S.q)}"></div>
      <div><label class="fl" for="flt">Show</label><select class="in" id="flt"><option value="all"${f === 'all' ? ' selected' : ''}>All students</option><option value="noFac"${f === 'noFac' ? ' selected' : ''}>No mentor yet</option><option value="noGroup"${f === 'noGroup' ? ' selected' : ''}>No class group yet</option><option value="noFam"${f === 'noFam' ? ' selected' : ''}>Not in a family</option></select></div>
      <button class="btn btn-line btn-sm" type="button" data-act="selAll">Select all shown</button></div>

function famForm(f, id) {

    ${act_.map((f) => `<details class="box stu" data-k="f-${esc(f.FamilyID)}"${S.open['f-' + f.FamilyID] ? ' open' : ''}><summary><div><b>${esc(f.Name)}</b><small>${esc(f.Mentor || 'No mentor')} · ${plural(f.Members.length, 'student')} · ${plural(f.Posts.length, 'post')}</small></div><div class="sum-r">${f.Rank ? `<span class="pill p-wash">Rank ${f.Rank}</span>` : ''}${f.Score != null ? `<span class="pill p-ink">${f.Score}</span>` : ''}</div></summary>
      <div class="body"><div class="grid" style="margin-top:0"><div class="c w6" style="padding:0;box-shadow:none;background:none">${famForm(f, 'f' + f.FamilyID.replace(/\W/g, ''))}

        <div class="acx-acts"><button class="btn btn-line btn-sm acx-danger" type="button" data-act="famRemove" data-id="${esc(f.FamilyID)}">Remove family</button></div></div>
        <div class="c w6" style="padding:0;box-shadow:none;background:none"><p class="k">Family board</p>
          <form class="acx-form acx-compose" data-form="post" data-fam="${esc(f.FamilyID)}"><textarea name="body" rows="2" maxlength="2000" placeholder="Post an announcement to this family" aria-label="Announcement"></textarea><button class="btn btn-ink btn-sm" type="submit">Post announcement</button></form>
          ${f.Posts.map((p) => famPost(p, f.FamilyID)).join('') || '<p class="empty">No posts yet.</p>'}</div></div></div></details>`).join('') || '<p class="empty" style="margin-top:12px">No families yet.</p>'}
    ${gone.length ? `<p class="k" style="margin-top:24px">Removed families</p><ul class="list">${gone.map((f) => `<li><span><b>${esc(f.Name)}</b></span><button type="button" data-act="famRestore" data-id="${esc(f.FamilyID)}">Restore</button></li>`).join('')}</ul>` : ''}</article></div>`;

/* ---------- payments (as before) ---------- */
function vPayments() {
  const rank = { Overdue: 0, Due: 1 };
  const list = D.students.slice().sort((a, b) => (rank[a.PaymentStatus] ?? 2) - (rank[b.PaymentStatus] ?? 2) || String(a.NextDue).localeCompare(String(b.NextDue)));
  const row = (s) => {
    const exempt = String(s.PaymentStatus).toLowerCase() === 'exempt';
    return `<details class="box stu" data-k="p-${esc(s.StudentID)}" data-name="${esc((s.Name + ' ' + s.StudentID).toLowerCase())}"${S.open['p-' + s.StudentID] ? ' open' : ''}>
    <summary><div><b>${esc(s.Name)}</b><small>${esc(s.StudentID)} · ${esc(s.Plan || 'UTME')} · ${exempt ? 'Exempt' : 'Next due ' + fdate(s.NextDue)}</small></div><div class="sum-r">${payPill(s)}</div></summary>
    <div class="body">${exempt ? '<p class="empty">This student is exempt from payment.</p>' : `<form class="frm" data-form="pay" data-id="${esc(s.StudentID)}">
      <div class="row3"><div><label class="fl">Amount received (₦)</label><input class="in" name="amount" type="number" min="1" step="any" value="${esc(s.MonthlyFee || '')}" required></div>
      <div><label class="fl">Months covered</label><select class="in" name="months">${[1, 2, 3, 4, 5, 6, 12].map((m) => `<option>${m}</option>`).join('')}</select></div>
      <div><label class="fl">Date received</label><input class="in" name="date" type="date" value="${esc(D.today)}" max="${esc(D.today)}" required></div></div>
      <div><label class="fl">Transfer reference (optional)</label><input class="in" name="reference" maxlength="60" placeholder="From the receipt"></div>
      <button class="btn btn-ink" type="submit">Confirm payment</button></form>`}</div></details>`;
  };
  const recent = (D.payments || []).slice(0, 8);
  return `<div class="grid"><article class="c w8"><h2>Payments</h2><p class="sub">Card payments are recorded automatically. For bank transfers, open a student, check the receipt they sent, and confirm. Overdue students are at the top; their class links are hidden until they pay.</p>
    <div class="tiles"><div class="tile warn"><b>${count((s) => s.PaymentStatus === 'Overdue')}</b><span>overdue</span></div><div class="tile"><b>${count((s) => s.PaymentStatus === 'Due')}</b><span>due soon</span></div><div class="tile"><b>${count((s) => s.PaymentStatus === 'Paid')}</b><span>paid up</span></div></div>
    <input class="in" id="q" type="search" placeholder="Search by name or ID" value="${esc(S.q)}" style="max-width:340px">
    <div id="stulist">${list.map(row).join('') || '<p class="empty" style="margin-top:12px">No students yet.</p>'}</div></article>
  <article class="c w4"><h2>Recently confirmed</h2>${recent.length ? `<table><tbody>${recent.map((p) => `<tr><td>${esc(p.Name || stuName(p.StudentID))}<br><span class="sub">${fdate(p.Date)}${p.Reference ? ' · ' + esc(p.Reference) : ''}</span></td><td style="text-align:end"><b>${naira(p.Amount)}</b><br><span class="sub">${esc(p.Months)} mo</span></td></tr>`).join('')}</tbody></table>` : '<p class="empty">Nothing confirmed yet.</p>'}</article></div>`;
}
function vAccount() {
  return `<article class="c w12" style="max-width:560px"><h2>Your account</h2><p class="sub">${esc(D.admin.Name)} · ${esc(D.admin.AdminID)}</p>
  <form class="frm" data-form="password"><div><label class="fl" for="np">New access code (8 characters or more)</label><input class="in" id="np" name="newCode" type="password" autocomplete="new-password" minlength="8" maxlength="40"></div>

const VIEWS = { families: vFamilies, reports: vReports, students: vStudents, mentors: vMentors, assign: vAssign, groups: vGroups, payments: vPayments, account: vAccount };
function render() {
  document.querySelectorAll('details[data-k]').forEach((x) => { S.open[x.dataset.k] = x.open; });
  S.addOpen = !!S.open.add;
  const a = D.admin, od = count((s) => s.PaymentStatus === 'Overdue'), nt = count((s) => !s.TeacherID);
  $('app').innerHTML = `<section class="greet"><div><small>Assalaamu alaykum</small><h1>${esc(a.Name)}</h1>
    <div class="chips"><span>Academy admin</span><span>${plural(D.students.length, 'student')}</span><span>${od} overdue</span><span>${nt} without a mentor</span></div></div></section>
  <nav class="tabs" role="tablist" aria-label="Sections">${TABS.map(([k, l]) => `<button role="tab" type="button" data-act="tab" data-t="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</nav>
  <div id="view">${VIEWS[S.tab]()}</div>
  <p class="foot">Only confirm a payment after you have seen the receipt. Removing a student keeps their records.</p>`;

function applyFilter() { const q = S.q.trim().toLowerCase(); document.querySelectorAll('#stulist [data-name]').forEach((el) => { el.hidden = !!q && el.dataset.name.indexOf(q) < 0; }); }

/* ---------- full student dashboard in an overlay ---------- */
function openView(id) {
  closeView();
  const ov = document.createElement('div'); ov.className = 'acx-ov'; ov.id = 'acxOv';
  ov.innerHTML = `<div class="acx-ov-in" role="dialog" aria-modal="true" aria-label="Student dashboard"><iframe src="academy-dashboard.html?view=${encodeURIComponent(id)}&as=admin" title="Student dashboard"></iframe></div>`;
  ov.addEventListener('click', (e) => { if (e.target === ov) closeView(); });
  document.body.appendChild(ov); document.body.classList.add('acx-noscroll');
}
function closeView() { const o = $('acxOv'); if (o) o.remove(); document.body.classList.remove('acx-noscroll'); }
window.addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.acx === 'close') closeView(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeView(); });

/* ---------- events ---------- */
const app = $('app');
const updCount = () => { const el = $('selCount'); if (el) el.textContent = Object.keys(S.sel).filter((k) => S.sel[k]).length + ' selected'; };
app.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tab') { S.tab = b.dataset.t; S.created = null; render(); window.scrollTo(0, 0); }
  else if (a === 'selAll') { const boxes = [...document.querySelectorAll('.asg')].filter((x) => !x.closest('label').hidden), all = boxes.every((x) => x.checked); boxes.forEach((x) => { x.checked = !all; S.sel[x.value] = !all; }); updCount(); }
  else if (a === 'view') openView(id);
  else if (a === 'csv') csv();
  else if (a === 'print') window.print();
  else if (a === 'hideCred') { S.created = null; render(); }
  else if (a === 'copyCred') { const c = S.created; const t = 'Himaayah Academy login\nID: ' + c.id + '\nAccess code: ' + c.code + '\n' + location.origin + (c.kind === 'mentor' ? '/academy-tutor.html' : '/academy-dashboard.html'); try { await navigator.clipboard.writeText(t); toast('Copied.'); } catch (x) { toast('Could not copy. Select the text instead.', true); } }
  else if (a === 'code') { if (window.confirm('Give ' + stuName(id) + ' a new access code? The old one stops working.')) act('acda_student_code', { studentId: id, email: window.confirm('Email the new code to the student?') }, 'New access code created.', b); }
  else if (a === 'remove') { if (window.confirm('Remove ' + stuName(id) + '? They will not be able to sign in. Their records are kept and you can restore them later.')) act('acda_student_remove', { studentId: id }, 'Student removed.', b); }
  else if (a === 'restore') act('acda_student_restore', { studentId: id }, 'Student restored.', b);
  else if (a === 'mcode') { if (window.confirm('Give this mentor a new access code? The old one stops working.')) act('acda_tutor_code', { tutorId: id, email: window.confirm('Email the new code to the mentor?') }, 'New access code created.', b); }
  else if (a === 'mremove') { if (window.confirm('Remove this mentor? They will not be able to sign in. Their mentees stay assigned until you move them.')) act('acda_tutor_remove', { tutorId: id }, 'Mentor removed.', b); }
  else if (a === 'mrestore') act('acda_tutor_restore', { tutorId: id }, 'Mentor restored.', b);
  else if (a === 'famRemove') { if (window.confirm('Remove this family? Its board is kept and students stay where they are until you move them.')) act('acda_family_remove', { familyId: id }, 'Family removed.', b); }
  else if (a === 'famRestore') act('acda_family_restore', { familyId: id }, 'Family restored.', b);
  else if (a === 'pin' || a === 'unpin') act('acda_post_pin', { postId: id, unpin: a === 'unpin' }, a === 'pin' ? 'Pinned.' : 'Unpinned.', b);
  else if (a === 'hidePost' || a === 'showPost') act('acda_post_hide', { postId: id, show: a === 'showPost' }, a === 'hidePost' ? 'Hidden from students.' : 'Shown again.', b);
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'flt') { S.filter = t.value; render(); }
  else if (t.classList.contains('asg')) { S.sel[t.value] = t.checked; updCount(); }
});
app.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; applyFilter(); } });
app.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, v = (n) => f.elements[n] ? f.elements[n].value : '', btn = f.querySelector('button[type=submit]');
  if (k === 'student') {
    if (!v('name').trim()) return toast('Enter the student’s full name.', true);
    const body = { studentId: f.dataset.id, name: v('name').trim(), matric: v('matric').trim(), track: v('track'), group: v('group'), tutorId: v('tutorId'), email: v('email').trim(), whatsapp: v('whatsapp').trim(), monthlyFee: v('monthlyFee'), nextDue: v('nextDue'), examDate: v('examDate'), sendEmail: !!(f.elements.sendEmail && f.elements.sendEmail.checked) };
    act('acda_student_save', body, f.dataset.id ? 'Saved.' : 'Student added.', btn).then((ok) => { if (ok && !f.dataset.id) { document.querySelectorAll('details.acx-add').forEach((x) => { x.open = false; }); S.open.add = false; render(); window.scrollTo(0, 0); } });
  } else if (k === 'mentor') {
    if (!v('name').trim()) return toast('Enter the mentor’s name.', true);
    act('acda_tutor_save', { tutorId: f.dataset.id, name: v('name').trim(), role: v('role'), email: v('email').trim(), whatsapp: v('whatsapp').trim(), sendEmail: !!(f.elements.sendEmail && f.elements.sendEmail.checked) }, f.dataset.id ? 'Saved.' : 'Mentor added.', btn).then((ok) => { if (ok && !f.dataset.id) { document.querySelectorAll('details.acx-add').forEach((x) => { x.open = false; }); S.open.addm = false; render(); window.scrollTo(0, 0); } });
  } else if (k === 'family') {
    if (!v('name').trim()) return toast('Enter the family name.', true);
    act('acda_family_save', { familyId: f.dataset.id, name: v('name').trim(), mentorId: v('mentorId'), motto: v('motto').trim() }, f.dataset.id ? 'Saved.' : 'Family created.', btn).then((ok) => { if (ok && !f.dataset.id) { document.querySelectorAll('details.acx-add').forEach((x) => { x.open = false; }); S.open.addf = false; render(); } });
  } else if (k === 'post') {
    if (!v('body').trim()) return toast('Write something first.', true);
    act('acda_post', { familyId: f.dataset.fam, kind: 'Announcement', body: v('body').trim() }, 'Announcement posted.', btn);
  } else if (k === 'group') {
    if (!v('group').trim()) return toast('Enter the class group name.', true);
    act('acda_group_save', { group: v('group').trim(), meetLink: v('meetLink').trim(), telegramLink: v('telegramLink').trim(), timetable: v('timetable').trim() }, 'Class group saved.', btn);
  } else if (k === 'pay') {
    const amount = Number(v('amount')); if (!(amount > 0)) return toast('Enter the amount received.', true);
    act('acda_payment', { studentId: f.dataset.id, amount, months: Number(v('months')), date: v('date'), reference: v('reference') }, 'Payment confirmed for ' + stuName(f.dataset.id) + '.', btn);
  } else if (k === 'assign') {
    const ids = Object.keys(S.sel).filter((x) => S.sel[x]);
    if (!ids.length) return toast('Tick at least one student.', true);
    if (!v('teacherId') && !v('level') && !v('familyId')) return toast('Choose a mentor, class group or family to apply.', true);
    act('acda_assign', { studentIds: ids, teacherId: v('teacherId'), level: v('level'), familyId: v('familyId') }, 'Saved for ' + plural(ids.length, 'student') + '.', btn).then((ok) => { if (ok) { S.sel = {}; render(); } });
  } else if (k === 'password') {
    if (v('newCode').length < 8) return toast('Your new code must be at least 8 characters.', true);
    if (v('newCode') !== v('again')) return toast('The two codes do not match.', true);
    const code = v('newCode');
    act('acda_password', { newCode: code }, 'Code changed.', btn).then((ok) => { if (ok) sessionStorage.setItem(KEY, JSON.stringify({ id: creds().id, code })); });
  }
});

/* ---------- login ---------- */
function showApp() { $('login').hidden = true; app.hidden = false; $('out').hidden = false; render(); window.scrollTo(0, 0); }
async function signIn(id, code, silent) {
  const btn = $('go'), err = $('err'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  sessionStorage.setItem(KEY, JSON.stringify({ id, code }));
  try {
    const d = await api('acda_login');
    if (d.ok) { D = d; showApp(); }
    else { sessionStorage.removeItem(KEY); if (!silent) err.textContent = d.error || 'Could not sign in.'; }
  } catch (e) { if (!silent) { sessionStorage.removeItem(KEY); err.textContent = 'Could not reach the school server. Please try again.'; } }
  btn.disabled = false; btn.textContent = 'Sign in';
}
$('demoNote').hidden = true;
$('lf').addEventListener('submit', (e) => { e.preventDefault(); const id = $('tid').value.trim(), code = $('tcode').value.trim(); if (!id || !code) { $('err').textContent = 'Enter your Admin ID and access code.'; return; } signIn(id, code); });
$('out').addEventListener('click', () => { closeView(); sessionStorage.removeItem(KEY); D = null; S.tab = 'reports'; S.sel = {}; S.created = null; app.hidden = true; app.innerHTML = ''; $('out').hidden = true; $('login').hidden = false; $('tcode').value = ''; });
{ const c = creds(); if (c.id && c.code) signIn(c.id, c.code, true); }
</script>
<script>
/* Show/hide toggle on every access-code box */
(function(){
  function deco(){
    document.querySelectorAll('input[type=password]:not([data-eye])').forEach(function(i){
      i.setAttribute('data-eye','1');
      var w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
      var b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show access code');
      b.addEventListener('click',function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide access code':'Show access code');});
      w.appendChild(b);
    });
  }
  deco();new MutationObserver(deco).observe(document.body,{childList:true,subtree:true});
})();
</script>
