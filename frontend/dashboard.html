<script>
/* ===== SETTINGS =====
   Paste your Google Apps Script web-app URL here (see SETUP.md).
   While it is empty the page runs in DEMO mode with sample data. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';
const MADRASAH_WA = '2347025842849';
const PAYMENT_WA = '2347047226487';   /* WhatsApp number students send payment receipts to. Confirm this is the right one. */
const LEVELS = ['Rawdah','Tamheedi','Awwal Ibtidā’iyyah','Thāniyah Ibtidā’iyyah','Thālithah Ibtidā’iyyah','Rābiʿah Ibtidā’iyyah','Awwal Iʿdādiyyah'];

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate = (iso, t) => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'}) + (t ? ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : ''); };
const naira = (n) => '\u20A6' + Number(n || 0).toLocaleString('en-NG');
/* Whole days from today to a date (negative = in the past). */
const dd = (iso) => Math.round((new Date(String(iso).slice(0, 10) + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
const inDays = (n) => n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days';
/* Only http(s) links are clickable; anything else (e.g. javascript:) shows as plain text. */
const safeUrl = (u) => /^https?:\/\//i.test(String(u ?? '').trim());

/* ---- demo data (shown only when API_URL is empty) ---- */
let demoData = null;
function demo() {
  if (demoData) return JSON.parse(JSON.stringify(demoData));
  const day = (n, h = 0) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, 0, 0, 0); return d.toISOString().slice(0, 16); };
  const ymd = (n) => day(n).slice(0, 10);
  demoData = { ok: true, student: { StudentID: 'DEMO', Name: 'Sample Student', Level: 'Thālithah Ibtidā’iyyah', Plan: 'Full Madrasah (Personal)', Teacher: 'Your teacher', PaymentStatus: 'Due', NextDue: ymd(4), MonthlyFee: 35000, AttendancePresent: 14, AttendanceTotal: 16, NextClass: day(1, 17), ClassLink: '#', Juz: 2, CurrentSurah: 'Al-Baqarah', CurrentAyah: 142 },
    hifdh: [['An-Nās','Memorised'],['Al-Falaq','Memorised'],['Al-Ikhlāṣ','Memorised'],['Al-Masad','Memorised'],['An-Naṣr','Revising'],['Al-Kāfirūn','Revising'],['Al-Baqarah','In progress'],['Āl ʿImrān','Not started']].map(([Surah, Status]) => ({ Surah, Status })),
    murajaah: [{Day:'Monday',Portion:'An-Nās to Al-Masad'},{Day:'Wednesday',Portion:'An-Naṣr and Al-Kāfirūn'},{Day:'Friday',Portion:'Al-Baqarah 1 to 141'}],
    results: [{Date:ymd(-42),Type:'Test',Subject:'Tajweed',Score:14,OutOf:20},{Date:ymd(-28),Type:'Hifdh test',Subject:'Juz ʿAmma',Score:17,OutOf:20},{Date:ymd(-14),Type:'Exam',Subject:'Aqeedah',Score:38,OutOf:50},{Date:ymd(-5),Type:'Hifdh test',Subject:'Al-Baqarah 1 to 141',Score:18,OutOf:20}],
    announcements: [{Date:ymd(-1),Title:'Sample announcement',Body:'Your teacher\u2019s notices appear here, such as class changes and exam dates.'}],
    materials: [{Title:'Sample revision notes (PDF)',URL:'#'},{Title:'Tajweed rules summary',URL:'#'}],
    assignments: [
      { AssignmentID: 'A1', Title: 'Noon sakinah practice', Subject: 'Tajweed', Instructions: 'Recite Al-Baqarah 1 to 5 and write down each rule you applied.', Assigned: ymd(-3), Due: ymd(2), Link: '#', MaxScore: 20, Status: 'To do', Submission: null },
      { AssignmentID: 'A2', Title: 'Seerah questions', Subject: 'Seerah', Instructions: 'Answer questions 1 to 5 from the handout.', Assigned: ymd(-7), Due: ymd(-1), Link: '', MaxScore: 10, Status: 'Overdue', Submission: null },
      { AssignmentID: 'A3', Title: 'Aqeedah worksheet', Subject: 'Tawheed', Instructions: 'Complete the worksheet and submit a photo link.', Assigned: ymd(-6), Due: ymd(3), Link: '', MaxScore: 20, Status: 'Submitted', Submission: { Submitted: day(-1, 20), Note: 'Done, Alhamdulillah.', Link: '', Score: '', Feedback: '', Late: false } },
      { AssignmentID: 'A4', Title: 'Fiqh of wudu', Subject: 'Fiqh', Instructions: 'Write the obligatory acts of wudu.', Assigned: ymd(-14), Due: ymd(-9), Link: '', MaxScore: 20, Status: 'Marked', Submission: { Submitted: day(-10, 18), Note: 'My answers are attached.', Link: '', Score: 17, Feedback: 'Good work. Revise the order of the acts.', Late: false } }],
    payments: [{Date:ymd(-26),Amount:35000,Months:1,Reference:'TRF-10421'},{Date:ymd(-56),Amount:35000,Months:1,Reference:'TRF-09877'}],
    recordings: { enabled: true, maxSeconds: 1200, maxMB: 15, items: [
      { RecID: 'R-DEMO2', Submitted: day(-1, 19), Type: 'New lesson', Surah: 'Al-Baqarah', FromAyah: 142, ToAyah: 152, Portion: 'Al-Baqarah 142\u2013152', Note: '', Seconds: 214, Status: 'Waiting', Memorisation: null, Tajwid: null, Fluency: null, Total: null, Result: '', Feedback: '' },
      { RecID: 'R-DEMO1', Submitted: day(-4, 18), Type: 'Revision', Surah: 'Al-Mulk', FromAyah: 1, ToAyah: 30, Portion: 'Al-Mulk 1\u201330', Note: 'I was unsure in ayah 16.', Seconds: 402, Status: 'Marked', Memorisation: 9, Tajwid: 7, Fluency: 4, Total: { Score: 20, OutOf: 25 }, Result: 'Pass', Feedback: 'Strong memorisation. Lengthen the madd in ayah 16, and slow down a little at the end.' }] } };
  return JSON.parse(JSON.stringify(demoData));
}
/* Demo recordings: audio stays in this browser only */
const demoAudio = {};
function demoTone() {   // one second of a soft tone, so "Listen" works on the sample recordings
  const n = 8000, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / 8000 * 2 * Math.PI * 330) * 4000 * Math.min(1, (n - i) / 2000), true);
  let b = ''; new Uint8Array(buf).forEach((x) => { b += String.fromCharCode(x); }); return btoa(b);
}
function demoRec(action, p) {
  const d = demo(), R = d.recordings;
  if (action === 'rec_audio') return demoAudio[p.recId] ? { ok: true, mime: demoAudio[p.recId].mime, audio: demoAudio[p.recId].audio } : { ok: true, mime: 'audio/wav', audio: demoTone() };
  if (action === 'rec_withdraw') {
    const x = R.items.find((i) => i.RecID === p.recId);
    if (!x) return { ok: false, error: 'Recording not found.' };
    if (x.Status === 'Marked') return { ok: false, error: 'This recording has already been marked.' };
    R.items = R.items.filter((i) => i !== x); demoData = d; return demo();
  }
  if (!p.surah) return { ok: false, error: 'Choose the surah.' };
  if (R.items.filter((i) => i.Status === 'Waiting').length >= 5) return { ok: false, error: 'You have 5 recordings waiting for your teacher. Please wait for them to be marked.' };
  const id = 'R-' + Math.random().toString(36).slice(2, 8).toUpperCase(), portion = p.surah + (p.fromAyah ? ' ' + p.fromAyah + (p.toAyah && p.toAyah !== p.fromAyah ? '\u2013' + p.toAyah : '') : '');
  demoAudio[id] = { mime: p.mime || 'audio/webm', audio: p.audio };
  R.items.unshift({ RecID: id, Submitted: new Date().toISOString(), Type: p.type, Surah: p.surah, FromAyah: p.fromAyah || null, ToAyah: p.toAyah || null, Portion: portion, Note: p.note || '', Seconds: p.seconds || 0, Status: 'Waiting', Memorisation: null, Tajwid: null, Fluency: null, Total: null, Result: '', Feedback: '' });
  demoData = d; return demo();
}
function demoSubmit(p) {
  const d = demo(), a = d.assignments.find((x) => x.AssignmentID === p.assignmentId);
  if (!a) return { ok: false, error: 'Assignment not found.' };
  if (a.Status === 'Marked') return { ok: false, error: 'This assignment has already been marked.' };
  a.Status = 'Submitted'; a.Submission = { Submitted: new Date().toISOString(), Note: p.note || '', Link: p.link || '', Score: '', Feedback: '', Late: a.Due < new Date().toISOString().slice(0, 10) };
  demoData = d; return demo();
}

async function api(id, code, action, extra) {
  if (!API_URL) {
    await new Promise((r) => setTimeout(r, 400));
    if (id.toUpperCase() !== 'DEMO' || code !== 'demo') return { ok: false, error: 'Wrong ID or access code.' };
    if (action === 'password') return String(extra.newCode || '').length < 8 ? { ok: false, error: 'Your new code must be 8 to 40 characters.' } : demo();
    if (/^rec_/.test(action || '')) return demoRec(action, extra || {});
    return action === 'submit' ? demoSubmit(extra) : demo();
  }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action || 'login', id, code }, extra || {})) });
  return r.json();
}

function reminders(s, d, status, due) {
  const out = [];
  if (status !== 'exempt' && !isNaN(due)) {
    const n = dd(s.NextDue);
    if (n < 0) out.push({ t: 'Your payment is ' + (-n) + ' day' + (n === -1 ? '' : 's') + ' overdue.', a: '#pay', u: 1, tag: 'Pay now' });
    else if (n <= 7) out.push({ t: 'Your payment is due ' + inDays(n) + '.', a: '#pay', tag: 'Payment' });
  }
  (d.assignments || []).filter((a) => (a.Status === 'To do' || a.Status === 'Overdue') && a.Due).forEach((a) => {
    const n = dd(a.Due);
    if (n < 0) out.push({ t: '\u201C' + esc(a.Title) + '\u201D is overdue.', a: '#assign', u: 1, tag: 'Submit' });
    else if (n <= 2) out.push({ t: '\u201C' + esc(a.Title) + '\u201D is due ' + inDays(n) + '.', a: '#assign', tag: 'Assignment' });
  });
  if (s.NextClass) { const n = dd(s.NextClass); if (n === 0 || n === 1) out.push({ t: 'Your next class is ' + inDays(n) + ' at ' + new Date(s.NextClass).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.', a: '#next', tag: 'Class' }); }
  return out;
}

function assignmentHtml(a) {
  const sb = a.Submission, st = a.Status;
  const cls = { 'To do': 'st-todo', 'Overdue': 'st-over', 'Submitted': 'st-sub', 'Marked': 'st-mark' }[st] || 'st-todo';
  const marked = st === 'Marked' && sb;
  return `<details class="asg" data-id="${esc(a.AssignmentID)}"><summary>
    <div><b>${esc(a.Title)}</b><small>${esc(a.Subject || 'Assignment')}${a.Due ? ' \u00B7 Due ' + fdate(a.Due) : ''}</small></div>
    <span class="pill ${cls}">${marked ? esc(sb.Score) + (a.MaxScore ? '/' + esc(a.MaxScore) : '') : esc(st)}</span></summary>
    <div class="abody">
      ${a.Instructions ? `<p>${esc(a.Instructions)}</p>` : ''}
      ${safeUrl(a.Link) ? `<p><a class="lnk" href="${esc(a.Link)}" target="_blank" rel="noopener">Open the resource</a></p>` : ''}
      ${marked ? `<div class="mark"><div class="k">Marked by your teacher</div><b>${esc(sb.Score)}${a.MaxScore ? '/' + esc(a.MaxScore) : ''}</b>${sb.Feedback ? `<p>${esc(sb.Feedback)}</p>` : ''}</div>` : ''}
      ${sb ? `<div class="mine"><div class="k">Your submission${sb.Late ? ' (late)' : ''}, ${fdate(sb.Submitted, true)}</div>${sb.Note ? `<p>${esc(sb.Note)}</p>` : ''}${safeUrl(sb.Link) ? `<p><a class="lnk" href="${esc(sb.Link)}" target="_blank" rel="noopener">Your link</a></p>` : ''}</div>` : ''}
      ${marked ? '' : `<form class="subm" data-id="${esc(a.AssignmentID)}" novalidate>
        <label for="n-${esc(a.AssignmentID)}">${sb ? 'Change your note' : 'Note to your teacher'}</label>

        <button class="btn btn-ink" type="submit">${sb ? 'Update submission' : 'Submit'}</button></form>`}

/* Weekly timetable for the student's level (Timetable tab), in Nigeria time */
const TT_DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const ttLagos = () => new Date(Date.now() + 3600000);
const tt12 = (t) => { const [h, m] = String(t).split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? 'am' : 'pm'); };
function ttNext(rows) {   // the next class from the timetable, as a local-time ISO string
  const n = ttLagos(), today = (n.getUTCDay() + 6) % 7, nowHM = String(n.getUTCHours()).padStart(2, '0') + ':' + String(n.getUTCMinutes()).padStart(2, '0');
  for (let i = 0; i < 8; i++) {
    const di = (today + i) % 7, c = rows.filter((r) => TT_DAYS.indexOf(r.Day) === di && (i > 0 || (r.End || r.Start) > nowHM)).sort((a, b) => a.Start < b.Start ? -1 : 1)[0];
    if (c) { const d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + i, +c.Start.slice(0, 2) - 1, +c.Start.slice(3, 5))); return { when: d.toISOString(), c }; }
  }
  return null;
}
function ttIcs(rows, level) {
  const n = ttLagos(), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Himaayah Schools//Timetable//EN', 'X-WR-CALNAME:Himaayah · ' + level];
  rows.forEach((c, i) => {
    const off = (TT_DAYS.indexOf(c.Day) - (n.getUTCDay() + 6) % 7 + 7) % 7;
    const at = (t) => new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + off, +t.slice(0, 2) - 1, +t.slice(3, 5))).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
    lines.push('BEGIN:VEVENT', 'UID:hs' + i + '-' + Math.random().toString(36).slice(2, 8) + '@himaayahschools.com', 'DTSTAMP:' + stamp, 'DTSTART:' + at(c.Start), 'DTEND:' + at(c.End || c.Start), 'RRULE:FREQ=WEEKLY',
      'SUMMARY:' + (c.Subject + ' · ' + level).replace(/[,;]/g, ' '), 'DESCRIPTION:' + (c.Link ? 'Join: ' + c.Link : 'Himaayah Schools class'), c.Link ? 'URL:' + c.Link : '', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.filter(Boolean).join('\r\n')], { type: 'text/calendar' }));
  a.download = 'himaayah-timetable.ics'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function ttCard(d) {
  const rows = d.timetable || []; if (!rows.length) return '';
  const today = TT_DAYS[(ttLagos().getUTCDay() + 6) % 7];
  const days = TT_DAYS.map((day) => ({ day, c: rows.filter((r) => r.Day === day) })).filter((x) => x.c.length);
  return `<article class="c w12" id="timetable" style="--i:3"><h2>Weekly timetable</h2><p class="sub">${esc(d.student.Level)} · Nigeria time</p>
    <div class="tt-week">${days.map((x) => `<div class="${x.day === today ? 'today' : ''}"><h3>${x.day}${x.day === today ? ' · Today' : ''}</h3>${x.c.map((c) => `<p><b>${esc(c.Subject)}</b><span dir="ltr">${tt12(c.Start)}${c.End ? '–' + tt12(c.End) : ''}</span></p>${safeUrl(c.Link) ? `<a href="${esc(c.Link)}" target="_blank" rel="noopener">Join</a>` : ''}`).join('')}</div>`).join('')}</div>
    <p class="sub" style="margin-top:14px"><button class="btn btn-line" type="button" id="ttIcsBtn">Add to my calendar</button></p></article>`;
}
/* ===== Recite to your teacher (Hifdh, One-Year Hifdh and Muraajah) =====

const REC = { form: { type: 'New lesson', surah: '', from: '', to: '', note: '' }, blob: null, url: '', secs: 0, mime: '', ext: '', fileName: '', mr: null, stream: null, t0: 0, tick: null, sending: false, playing: {} };
const REC_TYPES = ['New lesson', 'Revision', 'Test'];
const mmss = (n) => Math.floor(n / 60) + ':' + String(Math.floor(n % 60)).padStart(2, '0');

  const items = R.items || [], waiting = items.filter((x) => x.Status === 'Waiting').length;

  return `<article class="c w12" id="recite" style="--i:3"><h2>Recite to your teacher${waiting ? ` <span class="pill st-sub" style="font-size:12px;vertical-align:middle">${waiting} waiting</span>` : ''}</h2>
    <p class="sub">Record your new lesson or revision, or upload a voice note. Your teacher listens, gives you a score and tells you what to work on.</p>

  const code = f.elements.newCode.value.trim();
  if (!saved) return say('Please log in again.');
  if (code.length < 8) return say('Your new code must be at least 8 characters.');
  if (code !== f.elements.again.value.trim()) return say('The two codes do not match.');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const d = await api(saved.id, saved.code, 'password', { newCode: code });
    if (d.ok) {
      sessionStorage.setItem('hs', JSON.stringify({ id: saved.id, code }));
      render(d);
      const nf = document.querySelector('form.codef'); if (nf) { const m = nf.querySelector('.msg'); m.textContent = 'Code changed. Use your new code next time you sign in.'; m.className = 'msg good'; }
      return;
    }
    say(d.error || 'Could not change your code. Please try again.');
  } catch (err) { say('Could not reach the school server. Please try again.'); }
  btn.disabled = false; btn.textContent = 'Change my code';
}

/* Assignment submissions */
$('app').addEventListener('submit', async (e) => {
  const f = e.target.closest('form.subm'); if (!f) return;
  e.preventDefault();
  if (f.classList.contains('codef')) return changeCode(f);
  const msg = f.querySelector('.msg'), btn = f.querySelector('button'), id = f.dataset.id;
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('hs') || 'null'); } catch (x) {}
  const bad = (t) => { msg.textContent = t; msg.className = 'msg bad'; };
  if (!saved) return bad('Please log in again.');
  const note = f.elements.note.value.trim(), link = f.elements.link.value.trim();
  if (!note && !link) return bad('Add a note or a link to your work.');
  if (link && !safeUrl(link)) return bad('The link must start with http:// or https://');
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…'; msg.textContent = ''; msg.className = 'msg';
  try {
    const d = await api(saved.id, saved.code, 'submit', { assignmentId: id, note, link });
    if (d.ok) {
      render(d);
      const nf = [...document.querySelectorAll('form.subm')].find((x) => x.dataset.id === id);
      if (nf) { const m = nf.querySelector('.msg'); m.textContent = 'Saved. Your teacher can see it now.'; m.className = 'msg good'; }
      return;
    }
    bad(d.error || 'Could not submit. Please try again.');
  } catch (err) { bad('Could not reach the school server. Please try again.'); }
  btn.disabled = false; btn.textContent = label;
});

</script>
<script>
/* Show/hide toggle on every access-code box */
(function(){
  function deco(){
    document.querySelectorAll('input[type=password]:not([data-eye])').forEach(function(i){
      i.setAttribute('data-eye','1');
      var w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
      var b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show access code');
      b.addEventListener('click',function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide access code':'Show access code');});
      w.appendChild(b);
    });
  }
  deco();new MutationObserver(deco).observe(document.body,{childList:true,subtree:true});
})();
</script>
