<script src="js/reset-panel.js"></script>
<script>
/* ===== SETTINGS =====
   Same Apps Script web app as the other portals. While it is empty the page runs in DEMO mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
const money = (cur, n) => String(cur || '').toUpperCase() === 'USD' ? '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 }) : naira(n);
const fdate = (iso, t) => { const d = new Date(iso); return isNaN(d) ? esc(iso || 'Not set') : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + (t ? ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : ''); };
const TABS = [['payments', 'Payments'], ['assign', 'Assign'], ['curriculum', 'Curriculum'], ['reset', 'Reset code'], ['account', 'Account']];
let D = null;
const S = { tab: 'payments', q: '', filter: 'all', sel: {}, cc: '', edit: null };

/* ---------- talking to the school server ---------- */
const creds = () => { try { return JSON.parse(sessionStorage.getItem('hcsa') || 'null') || {}; } catch (e) { return {}; } };
async function api(action, extra) {
  const c = creds();
  if (!API_URL) return demoApi(c, action, extra || {});
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, id: c.id, code: c.code }, extra || {})) });
  return r.json();
}
let toastT;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 5000 : 3000);
}
let busy = false;
async function act(action, extra, okMsg, btn) {
  if (busy) return false;
  busy = true; const old = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const d = await api(action, extra);
    if (d.ok) { D = d; if (okMsg) toast(okMsg); render(); return true; }
    toast(d.error || 'Could not save. Please try again.', true);
  } catch (e) { toast('Could not reach the school server. Please try again.', true); }
  finally { busy = false; if (btn && document.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
  return false;
}

/* ---------- helpers ---------- */
const PCLS = { Paid: 'p-ink', Exempt: 'p-wash', Overdue: 'p-red', Due: 'p-sky' };
const payPill = (s) => `<span class="pill ${PCLS[s.PaymentStatus] || 'p-sky'}">${esc(s.PaymentStatus || 'Due')}</span>`;
const stuName = (id) => (D.students.find((s) => s.StudentID === id) || {}).Name || id;
const opts = (list, first) => `<option value="">${esc(first)}</option>` + list.map((x) => `<option value="${esc(x.v)}">${esc(x.t)}</option>`).join('');
const count = (fn) => D.students.filter(fn).length;

/* ---------- views ---------- */
function vPayments() {
  const rank = { Overdue: 0, Due: 1 };
  const list = D.students.slice().sort((a, b) => (rank[a.PaymentStatus] ?? 2) - (rank[b.PaymentStatus] ?? 2) || String(a.NextDue).localeCompare(String(b.NextDue)));
  const row = (s) => {
    const exempt = String(s.PaymentStatus).toLowerCase() === 'exempt', usd = s.Currency === 'USD', inst = Number(s.Instalments) || 0, paidN = Number(s.InstPaid) || 0, allPaid = usd && inst > 0 && paidN >= inst;
    const sub = exempt ? 'Exempt' : usd ? (allPaid ? 'All ' + inst + ' payments received' : (inst ? 'Payment ' + (paidN + 1) + ' of ' + inst : 'US dollars') + (s.NextDue ? ' · due ' + fdate(s.NextDue) : '')) : s.NextDue ? 'Next due ' + fdate(s.NextDue) : esc(s.Period || 'One-time');
    const form = exempt ? '<p class="empty">This student is exempt from payment.</p>'
      : allPaid ? '<p class="empty">Every instalment on this plan has been received.</p>'
      : `<form class="frm" data-form="pay" data-id="${esc(s.StudentID)}" data-cur="${usd ? 'USD' : 'NGN'}">
      <div class="row3"><div><label class="fl">Amount received (${usd ? '$' : '₦'})</label><input class="in" name="amount" type="number" min="0.01" step="any" value="${esc(s.Fee || '')}" required></div>
      <div><label class="fl">Covers</label>${usd ? `<select class="in" name="months"><option value="0">${inst ? 'Payment ' + (paidN + 1) + ' of ' + inst : 'Next instalment'}</option></select>` : `<select class="in" name="months">${s.NextDue ? [2, 1, 3, 4, 6].map((m) => `<option value="${m}">${m} month${m === 1 ? '' : 's'}</option>`).join('') : '<option value="0">The whole course</option>'}</select>`}</div>
      <div><label class="fl">Date received</label><input class="in" name="date" type="date" value="${esc(D.today)}" max="${esc(D.today)}" required></div></div>
      <div><label class="fl">Transfer reference (optional)</label><input class="in" name="reference" maxlength="60" placeholder="From the receipt"></div>
      <button class="btn btn-ink" type="submit">Confirm payment</button></form>`;
    return `<details class="box stu" data-name="${esc((s.Name + ' ' + s.StudentID).toLowerCase())}"${s.StudentID === S.open ? ' open' : ''} data-id="${esc(s.StudentID)}">
    <summary><div><b>${esc(s.Name)}</b><small>${esc(s.StudentID)} · ${esc(s.Plan)}${s.Level ? ' · ' + esc(s.Level) : ''} · ${sub}</small></div><div class="sum-r">${payPill(s)}</div></summary>
    <div class="body">${form}</div></details>`;
  };
  const recent = (D.payments || []).slice(0, 8);
  return `<div class="grid"><article class="c w8"><h2>Payments</h2><p class="sub">Open a student, check the receipt they sent, and confirm. Overdue students are at the top.</p>
    <div class="tiles"><div class="tile warn"><b>${count((s) => s.PaymentStatus === 'Overdue')}</b><span>overdue</span></div><div class="tile"><b>${count((s) => s.PaymentStatus === 'Due')}</b><span>due soon</span></div><div class="tile"><b>${count((s) => s.PaymentStatus === 'Paid')}</b><span>paid up</span></div></div>
    <input class="in" id="q" type="search" placeholder="Search by name or ID" value="${esc(S.q)}" style="max-width:340px">
    <div id="stulist">${list.map(row).join('') || '<p class="empty" style="margin-top:12px">No students yet.</p>'}</div></article>
  <article class="c w4"><h2>Recently confirmed</h2>${recent.length ? `<table><tbody>${recent.map((p) => `<tr><td>${esc(p.Name || stuName(p.StudentID))}<br><span class="sub">${fdate(p.Date)}${p.Reference ? ' · ' + esc(p.Reference) : ''}</span></td><td style="text-align:end"><b>${money(p.Currency, p.Amount)}</b><br><span class="sub">${p.Currency === 'USD' ? 'instalment' : p.Months ? esc(p.Months) + ' mo' : 'course'}</span></td></tr>`).join('')}</tbody></table>` : '<p class="empty">Nothing confirmed yet.</p>'}</article></div>`;
}

function vAssign() {
  const f = S.filter;
  const shown = D.students.filter((s) => f === 'all' || (f === 'noFac' && !s.TeacherID) || (f === 'noGroup' && !s.Level) || (f === 'noStart' && !s.StartDate));
  const load = D.teachers.map((t) => ({ t, n: count((s) => s.TeacherID === t.TeacherID) }));
  return `<div class="grid"><article class="c w8"><h2>Students</h2><p class="sub">Tick the students, then choose a tutor, cohort or start date on the right. Anything left on “No change” is untouched.</p>
    <div class="tiles"><div class="tile"><b>${D.students.length}</b><span>students</span></div><div class="tile ${count((s) => !s.TeacherID) ? 'warn' : ''}"><b>${count((s) => !s.TeacherID)}</b><span>no tutor yet</span></div><div class="tile ${count((s) => !s.Level) ? 'warn' : ''}"><b>${count((s) => !s.Level)}</b><span>no cohort yet</span></div></div>
    <div class="tool"><div><label class="fl" for="q">Search</label><input class="in" id="q" type="search" placeholder="Name or ID" value="${esc(S.q)}"></div>
      <div><label class="fl" for="flt">Show</label><select class="in" id="flt"><option value="all"${f === 'all' ? ' selected' : ''}>All students</option><option value="noFac"${f === 'noFac' ? ' selected' : ''}>No tutor yet</option><option value="noGroup"${f === 'noGroup' ? ' selected' : ''}>No cohort yet</option><option value="noStart"${f === 'noStart' ? ' selected' : ''}>No start date yet</option></select></div>
      <button class="btn btn-line btn-sm" type="button" data-act="selAll">Select all shown</button></div>
    <div class="pick" id="stulist">${shown.map((s) => `<label data-name="${esc((s.Name + ' ' + s.StudentID).toLowerCase())}"><input type="checkbox" class="asg" value="${esc(s.StudentID)}"${S.sel[s.StudentID] ? ' checked' : ''}> <span><b>${esc(s.Name)}</b> <span class="sub">${esc(s.Plan)} · ${esc(s.Level || 'No cohort')}${s.StartDate ? ' · starts ' + fdate(s.StartDate) : ''}</span></span><small>${esc(s.Teacher || 'No tutor')}</small></label>`).join('') || '<p class="empty">No students match.</p>'}</div></article>
  <div class="c w4" style="display:grid;gap:16px;align-content:start;padding:0;background:none;box-shadow:none">
    <article class="c" style="grid-column:auto"><h2>Assign selected</h2><p class="sub" id="selCount">${Object.keys(S.sel).filter((k) => S.sel[k]).length} selected</p>
      <form class="frm" data-form="assign">
        <div><label class="fl" for="at">Tutor</label><select class="in" id="at" name="teacherId">${opts(D.teachers.map((t) => ({ v: t.TeacherID, t: t.Name })), 'No change')}</select></div>
        <div><label class="fl" for="al">Cohort</label><select class="in" id="al" name="level">${opts(D.levels.map((l) => ({ v: l, t: l })), 'No change')}</select></div>
        <div><label class="fl" for="as">Start date</label><input class="in" id="as" name="startDate" type="date"></div>
        <button class="btn btn-ink" type="submit">Apply to selected</button></form></article>
    <article class="c" style="grid-column:auto"><h2>Tutor load</h2><ul class="list">${load.map((x) => `<li><span><b>${esc(x.t.Name)}</b></span><span>${x.n} student${x.n === 1 ? '' : 's'}</span></li>`).join('') || '<li>No tutors yet.</li>'}</ul></article>
  </div></div>`;
}

function vCurriculum() {
  const courses = D.courses || [], cur = S.cc || (courses[0] && courses[0].Course) || '', info = courses.filter((c) => c.Course === cur)[0] || { Weeks: 0 };
  S.cc = cur;
  const rows = (D.curriculum || []).filter((c) => c.Course === cur), e = S.edit && S.edit.course === cur ? S.edit : null;
  const hasWeek = new Set(rows.map((r) => r.Week)), missing = []; for (let w = 1; w <= info.Weeks; w++) if (!hasWeek.has(w)) missing.push(w);
  return `<div class="grid"><article class="c w4"><h2>${e ? 'Edit week ' + e.week : 'Add or change a week'}</h2><p class="sub">Students on the course see these weeks on their dashboard. Saving a week that already exists replaces it.</p>
    <form class="frm" data-form="curweek"><div><label class="fl" for="cc">Course</label><select class="in" id="cc" name="course">${courses.map((c) => `<option value="${esc(c.Course)}"${c.Course === cur ? ' selected' : ''}>${esc(c.Course)}</option>`).join('')}</select></div>
      <div class="row2"><div><label class="fl" for="cw">Week (1 to ${info.Weeks})</label><input class="in" id="cw" name="week" type="number" min="1" max="${info.Weeks}" value="${e ? esc(e.week) : ''}" required></div><div><label class="fl" for="ct">Title</label><input class="in" id="ct" name="title" maxlength="120" value="${e ? esc(e.title) : ''}" placeholder="e.g. Principles of layout" required></div></div>
      <div><label class="fl" for="cp">What is covered</label><textarea class="in" id="cp" name="topics" rows="4" maxlength="2000" placeholder="Topics, tools and what the student should be able to do">${e ? esc(e.topics) : ''}</textarea></div>
      <button class="btn btn-ink" type="submit">Save week</button>${e ? ' <button class="btn btn-line" type="button" data-act="cancelEdit">Cancel</button>' : ''}</form>
    <h2 style="margin-top:24px">Paste many weeks</h2><p class="sub">One week per line as <b>week | title | topics</b>. The topics part is optional.</p>
    <form class="frm" data-form="curbulk"><textarea class="in" name="bulk" rows="6" placeholder="1 | Introduction to the field | Tools, terms, how the 18 months work&#10;2 | Foundations | ..."></textarea><button class="btn btn-ink" type="submit">Save pasted weeks</button></form></article>
  <article class="c w8"><h2>${esc(cur)} curriculum</h2><p class="sub">${rows.length} of ${info.Weeks} weeks written${missing.length && missing.length <= 12 ? '. Missing: week ' + missing.join(', ') : missing.length ? '. ' + missing.length + ' weeks still to write' : '. Complete'}.</p>
    ${rows.map((r) => `<details class="box"><summary><div><b>Week ${r.Week}: ${esc(r.Title)}</b></div><div class="sum-r"><button class="btn btn-line btn-sm" type="button" data-act="editWeek" data-w="${r.Week}">Edit</button><button class="btn btn-line btn-sm" type="button" data-act="removeWeek" data-w="${r.Week}">Remove</button></div></summary><div class="body"><p class="sub">${esc(r.Topics) || 'No details yet.'}</p></div></details>`).join('') || '<p class="empty">No weeks written for this course yet.</p>'}</article></div>`;
}

function vAccount() {
  return `<article class="c w12" style="max-width:560px"><h2>Your account</h2><p class="sub">${esc(D.admin.Name)} · ${esc(D.admin.AdminID)}</p>
  <form class="frm" data-form="password"><div><label class="fl" for="np">New access code (8 characters or more)</label><input class="in" id="np" name="newCode" type="password" autocomplete="new-password" minlength="8" maxlength="40"></div>
  <div><label class="fl" for="np2">Type it again</label><input class="in" id="np2" name="again" type="password" autocomplete="new-password"></div>
  <button class="btn btn-ink" type="submit">Change my code</button></form></article>`;
}

const VIEWS = { payments: vPayments, assign: vAssign, curriculum: vCurriculum, reset: () => ResetPanel.view(), account: vAccount };
function render() {
  const a = D.admin, od = count((s) => s.PaymentStatus === 'Overdue'), nt = count((s) => !s.TeacherID), soon = count((s) => s.PaymentStatus === 'Due');
  const first = String(a.Name || '').split(' ')[0] || 'admin';
  const tile = (label, value, lab, altV, altL, foot, dark, cls) => `<div class="ps-stat${dark ? ' dark' : ''}"><small>${esc(label)}</small><div class="ps-row"><div><div class="ps-big${cls ? ' ' + cls : ''}">${esc(value)}</div><span class="ps-lab">${esc(lab)}</span></div>${altL ? `<div class="ps-alt"><div class="ps-big">${esc(altV)}</div><span class="ps-lab">${esc(altL)}</span></div>` : ''}</div>${foot || ''}</div>`;
  const odFoot = od ? `<div class="ps-foot"><a href="#" data-act="goto" data-t="payments" style="color:#094570;font-weight:600">Review payments</a></div>` : '<div class="ps-foot"><b>Nobody is overdue.</b></div>';
  const ntFoot = nt ? `<div class="ps-foot"><a href="#" data-act="goto" data-t="assign" data-f="noFac">Assign now</a></div>` : '<div class="ps-foot"><b>Every student has a tutor.</b></div>';
  const banner = od
    ? { title: od + ' payment' + (od === 1 ? ' is' : 's are') + ' overdue', text: 'Class links and groups pause for these students until you confirm a payment. Check the receipt first, then confirm it.', tab: 'payments', cta: 'Open payments' }
    : nt ? { title: nt + ' student' + (nt === 1 ? ' needs' : 's need') + ' a tutor', text: 'Assign a tutor, a cohort and a start date so they can begin.', tab: 'assign', f: 'noFac', cta: 'Assign students' }
    : { title: 'Assalaamu alaykum, ' + first + '!', text: 'Everything is up to date. Confirm payments as the receipts arrive.', tab: 'payments', cta: 'Open payments' };
  $('app').innerHTML = `<section class="ps-top" aria-label="Overview"><h1>Welcome, ${esc(first)}</h1>
    <div class="chips"><span>Skills School admin</span><span>${D.students.length} students</span><span>${D.teachers.length} tutors</span></div>
    <div class="ps-stats">${tile('Students', D.students.length, 'In Skills School', D.courses.length, 'Courses', `<div class="ps-foot">${soon} due soon</div>`)}${tile('Overdue payments', od, 'Classes paused', soon, 'Due soon', odFoot, false, od ? '' : 'good')}${tile('Tutors needed', nt, 'Students without a tutor', D.teachers.length, 'Tutors', ntFoot, true)}</div>
    <section class="ps-banner" aria-label="Notice"><svg class="ps-mark" viewBox="0 0 377.21 459.6" fill="#094570" aria-hidden="true"><path d="${MARKP}"/></svg><div class="ps-slide on"><h2>${esc(banner.title)}</h2><p>${esc(banner.text)}</p><button class="ps-cta" type="button" style="border:0;cursor:pointer" data-act="goto" data-t="${banner.tab}" data-f="${banner.f || ''}">${esc(banner.cta)}</button></div></section></section>
  <div id="view">${VIEWS[S.tab]()}</div>
  <p class="foot">${API_URL ? '' : 'Demo mode: sample data, nothing is saved. '}Only confirm a payment after you have seen the receipt. Class times, projects and registers are handled by tutors.</p>`;
  shellSync(od);
  applyFilter();
}

/* ---------- left menu and top bar (same look as the student portal; styles in css/portal-shell.css) ---------- */
const MARKP = document.querySelector('.brand svg path').getAttribute('d');
const NSVG = 'http://www.w3.org/2000/svg';
const ICO = { card: 'M3 6h18v12H3zM3 10h18M7 15h4', users: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20c0-3.5 3-6 7-6s7 2.5 7 6M17 5a3 3 0 0 1 0 6M19 14c2 .7 3 2.4 3 5', layers: 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5', key: 'M14 10a4 4 0 1 1-1.2-2.8L21 15v3h-3v-2h-2v-2h-2.2', me: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6', bell: 'M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21a2 2 0 0 0 4 0', menu: 'M4 7h16M4 12h16M4 17h16', down: 'M6 9l6 6 6-6' };
const NAVICON = { payments: 'card', assign: 'users', curriculum: 'layers', reset: 'key', account: 'me' };
const svgI = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICO[k]}"/></svg>`;
let shell = null;
function buildShell() {
  const wrap = document.createElement('div'); wrap.id = 'adminShell';
  wrap.innerHTML = `<aside class="ps-side" aria-label="Menu"><a class="ps-brand" href="./"><svg viewBox="0 0 377.21 459.6" width="26" height="32" fill="#094570" aria-hidden="true"><path d="${MARKP}"/></svg><div><b>Himaayah</b><small>Skills School admin</small></div></a>
    <nav aria-label="Sections"><ul class="ps-nav">${TABS.map(([k, l]) => `<li><button type="button" data-t="${k}">${svgI(NAVICON[k])}<span>${l}</span></button></li>`).join('')}</ul></nav>
    <div class="ps-help"><b>Need help?</b><p>Questions about this portal? Message the school team.</p><a href="./">Himaayah home</a></div></aside>
    <header class="ps-bar"><button class="ps-burger" type="button" aria-label="Open menu">${svgI('menu')}</button>
    <button class="ps-bell" type="button" id="psBell" aria-label="Overdue payments">${svgI('bell')}</button>
    <button class="ps-user" type="button" id="psUser" aria-haspopup="true"><span class="ps-av" id="psAv"></span><span class="ps-nm" id="psNm"></span>${svgI('down')}</button></header>
    <div class="ps-pop" id="psPop" hidden></div><div class="ps-scrim"></div>`;
  document.body.appendChild(wrap);
  const de = document.documentElement, pop = wrap.querySelector('#psPop');
  const closeAll = () => { de.classList.remove('ps-open'); pop.hidden = true; };
  wrap.querySelectorAll('.ps-nav button').forEach((b) => b.addEventListener('click', () => { go(b.dataset.t); closeAll(); }));
  wrap.querySelector('.ps-burger').addEventListener('click', () => de.classList.toggle('ps-open'));
  wrap.querySelector('.ps-scrim').addEventListener('click', closeAll);
  wrap.querySelector('#psBell').addEventListener('click', () => { go('payments'); closeAll(); });
  wrap.querySelector('#psUser').addEventListener('click', () => {
    if (!pop.hidden) { pop.hidden = true; return; }
    pop.innerHTML = '';
    const mk = (tag, txt, fn) => { const n = document.createElement(tag); n.textContent = txt; if (fn) { n.type = 'button'; n.addEventListener('click', () => { pop.hidden = true; fn(); }); } pop.appendChild(n); return n; };
    mk('p', (D.admin.AdminID || '') + ' · ' + (D.admin.Name || ''));
    mk('button', 'Change access code', () => go('account'));
    const home = mk('a', 'Himaayah home'); home.href = './';
    pop.appendChild(document.createElement('hr'));
    mk('button', 'Log out', () => $('out').click());
    pop.hidden = false;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
  document.addEventListener('click', (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('#psUser')) pop.hidden = true; });
  return wrap;
}
function shellSync(od) {
  if (!shell) shell = buildShell();
  document.documentElement.classList.add('ps-on');
  const nm = String(D.admin.Name || 'Admin').trim(), parts = nm.split(/\s+/);
  shell.querySelector('#psAv').textContent = ((parts[0][0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  shell.querySelector('#psNm').textContent = nm;
  shell.querySelectorAll('.ps-nav button').forEach((b) => {
    b.setAttribute('aria-current', b.dataset.t === S.tab ? 'true' : 'false');
    const old = b.querySelector('i'); if (old) old.remove();
    if (b.dataset.t === 'payments' && od) { const i = document.createElement('i'); i.textContent = od; b.appendChild(i); }
  });
  const bell = shell.querySelector('#psBell'), em = bell.querySelector('em'); if (em) em.remove();
  if (od) { const e = document.createElement('em'); e.textContent = od; bell.appendChild(e); }
}
function shellOff() { document.documentElement.classList.remove('ps-on', 'ps-open'); if (shell) { shell.remove(); shell = null; } }
function go(tab, filter) { S.tab = tab; if (filter) S.filter = filter; render(); window.scrollTo(0, 0); }
function applyFilter() {
  const q = S.q.trim().toLowerCase();
  document.querySelectorAll('#stulist [data-name]').forEach((el) => { el.hidden = !!q && el.dataset.name.indexOf(q) < 0; });
}

/* ---------- events ---------- */
const app = $('app');
ResetPanel.init({ role: 'skills', api, toast, root: app });
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'goto') { e.preventDefault(); go(b.dataset.t, b.dataset.f); }
  else if (b.dataset.act === 'tab') { S.tab = b.dataset.t; render(); window.scrollTo(0, 0); }
  else if (b.dataset.act === 'editWeek') { const w = Number(b.dataset.w), r = (D.curriculum || []).filter((c) => c.Course === S.cc && c.Week === w)[0]; if (r) { S.edit = { course: r.Course, week: r.Week, title: r.Title, topics: r.Topics }; render(); window.scrollTo(0, 0); } }
  else if (b.dataset.act === 'cancelEdit') { S.edit = null; render(); }
  else if (b.dataset.act === 'removeWeek') { e.preventDefault(); e.stopPropagation(); act('ska_curriculum', { course: S.cc, week: Number(b.dataset.w), remove: true }, 'Week ' + b.dataset.w + ' removed.', b); }
  else if (b.dataset.act === 'selAll') {
    const boxes = [...document.querySelectorAll('.asg')].filter((x) => !x.closest('label').hidden), all = boxes.every((x) => x.checked);
    boxes.forEach((x) => { x.checked = !all; S.sel[x.value] = !all; }); updCount();
  }
});
const updCount = () => { const el = $('selCount'); if (el) el.textContent = Object.keys(S.sel).filter((k) => S.sel[k]).length + ' selected'; };
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'flt') { S.filter = t.value; render(); }
  else if (t.id === 'cc') { S.cc = t.value; S.edit = null; render(); }
  else if (t.classList.contains('asg')) { S.sel[t.value] = t.checked; updCount(); }
});
app.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; applyFilter(); } });
app.addEventListener('toggle', (e) => { const d = e.target; if (d.classList && d.classList.contains('stu')) S.open = d.open ? d.dataset.id : (S.open === d.dataset.id ? '' : S.open); }, true);
app.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, v = (n) => f.elements[n] ? f.elements[n].value : '', btn = f.querySelector('button[type=submit]');
  if (k === 'pay') {
    const amount = Number(v('amount')); if (!(amount > 0)) return toast('Enter the amount received.', true);
    act('ska_payment', { studentId: f.dataset.id, amount, months: Number(v('months')), date: v('date'), reference: v('reference') }, 'Payment confirmed for ' + stuName(f.dataset.id) + '.', btn);
  } else if (k === 'assign') {
    const ids = Object.keys(S.sel).filter((x) => S.sel[x]);
    if (!ids.length) return toast('Tick at least one student.', true);
    if (!v('teacherId') && !v('level') && !v('startDate')) return toast('Choose a tutor, a cohort or a start date to apply.', true);
    act('ska_assign', { studentIds: ids, teacherId: v('teacherId'), level: v('level'), startDate: v('startDate') }, 'Saved for ' + ids.length + ' student' + (ids.length === 1 ? '' : 's') + '.', btn).then((ok) => { if (ok) S.sel = {}; render(); });
  } else if (k === 'curweek') {
    const week = Number(v('week')), title = v('title').trim(); if (!(week >= 1)) return toast('Enter the week number.', true); if (!title) return toast('Give the week a title.', true);
    S.cc = v('course'); act('ska_curriculum', { course: v('course'), week, title, topics: v('topics').trim() }, 'Week ' + week + ' saved.', btn).then((ok) => { if (ok) { S.edit = null; render(); } });
  } else if (k === 'curbulk') {
    const rows = v('bulk').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const p = l.split('|'); return { week: Number(p[0]), title: (p[1] || '').trim(), topics: p.slice(2).join('|').trim() }; });
    if (!rows.length) return toast('Paste at least one line.', true);
    if (rows.some((r) => !(r.week >= 1) || !r.title)) return toast('Each line needs a week number and a title, like: 3 | Title | topics', true);
    act('ska_curriculum', { course: S.cc || ((D.courses[0] || {}).Course || ''), rows }, rows.length + ' week' + (rows.length === 1 ? '' : 's') + ' saved.', btn);
  } else if (k === 'password') {
    if (v('newCode').length < 8) return toast('Your new code must be at least 8 characters.', true);
    if (v('newCode') !== v('again')) return toast('The two codes do not match.', true);
    const code = v('newCode');
    act('ska_password', { newCode: code }, 'Code changed.', btn).then((ok) => { if (ok) sessionStorage.setItem('hcsa', JSON.stringify({ id: creds().id, code })); });
  }
});

/* ---------- login ---------- */
function showApp() { $('login').hidden = true; app.hidden = false; $('out').hidden = false; render(); window.scrollTo(0, 0); }
async function signIn(id, code, silent) {
  const btn = $('go'), err = $('err'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  sessionStorage.setItem('hcsa', JSON.stringify({ id, code }));
  try {
    const d = await api('ska_login');
    if (d.ok) { D = d; showApp(); }
    else { sessionStorage.removeItem('hcsa'); if (!silent) err.textContent = d.error || 'Could not sign in.'; }
  } catch (e) { sessionStorage.removeItem('hcsa'); if (!silent) err.textContent = 'Could not reach the school server. Please try again.'; }
  btn.disabled = false; btn.textContent = 'Sign in';
}
$('demoNote').hidden = !!API_URL;
$('lf').addEventListener('submit', (e) => { e.preventDefault(); const id = $('tid').value.trim(), code = $('tcode').value.trim(); if (!id || !code) { $('err').textContent = 'Enter your Admin ID and access code.'; return; } signIn(id, code); });
$('out').addEventListener('click', () => { ResetPanel.reset(); sessionStorage.removeItem('hcsa'); D = null; S.tab = 'payments'; S.sel = {}; app.hidden = true; app.innerHTML = ''; shellOff(); $('out').hidden = true; $('login').hidden = false; $('tcode').value = ''; });

/* ---------- demo mode (only used while API_URL is empty) ---------- */
let DEMO = null;
const isoD = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const plus = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
function demoBase() {
  const T = { 'ST-001': 'Ustadhah Maryam', 'ST-002': 'Brother Kunle' };
  const st = (id, name, course, cohort, fee, status, due, period, tid, start) => ({ StudentID: id, Name: name, Plan: course, Level: cohort, Fee: fee, MonthlyFee: fee, PaymentStatus: status, NextDue: due, Period: period, TeacherID: tid || '', Teacher: tid ? T[tid] : '', StartDate: start || '', Currency: 'NGN', InstPaid: 0, Instalments: 0 });
  return { ok: true, today: isoD(new Date()), admin: { AdminID: 'DEMO', Name: 'Admin Demo' },
    students: [st('SK-0001', 'Aisha Bello', 'Graphic Design', 'Cohort 1', 35000, 'Paid', '', 'One-time', 'ST-001', isoD(plus(-15))), st('SK-0002', 'Yusuf Adeyemi', 'Data Analysis', 'Cohort 1', 80000, 'Due', isoD(plus(4)), 'Every 2 months', 'ST-002', isoD(plus(-50))), st('SK-0003', 'Maryam Lawal', 'Public Speaking', '', 25000, 'Paid', '', 'One-time', '', ''), st('SK-0004', 'Ibrahim Sani', 'Data Analysis', '', 80000, 'Overdue', isoD(plus(-2)), 'Every 2 months', '', '')],
    teachers: [{ TeacherID: 'ST-001', Name: 'Ustadhah Maryam' }, { TeacherID: 'ST-002', Name: 'Brother Kunle' }],
    levels: ['Cohort 1', 'Cohort 2'],
    courses: [{ Course: 'Graphic Design', Weeks: 6 }, { Course: 'Public Speaking', Weeks: 4 }, { Course: 'Web Development (18 months)', Weeks: 78 }],
    curriculum: [{ Course: 'Graphic Design', Week: 1, Title: 'Principles of layout', Topics: 'Grids, alignment, spacing.' }, { Course: 'Graphic Design', Week: 2, Title: 'Logo concepts', Topics: 'Sketching and black and white first.' }],
    payments: [{ Date: isoD(plus(-9)), StudentID: 'SK-0001', Name: 'Aisha Bello', Amount: 35000, Months: 0, Reference: 'ENR-SAMPLE' }] };
}
async function demoApi(c, action, p) {
  await new Promise((r) => setTimeout(r, 120));
  if (String(c.id || '').toUpperCase() !== 'DEMO' || c.code !== 'demo') return { ok: false, error: 'Wrong ID or access code.' };
  if (!DEMO) DEMO = demoBase();
  const bad = (m) => ({ ok: false, error: m }), stu = (id) => DEMO.students.find((s) => s.StudentID === id);
  if (action === 'ska_payment') {
    const s = stu(p.studentId); if (!s) return bad('Student not found.');
    if (!(Number(p.amount) > 0)) return bad('Enter the amount received.');
    if (!(p.months >= 0 && p.months <= 24)) return bad('Months must be between 0 and 24.');
    if (!p.date || p.date > DEMO.today) return bad('The date cannot be in the future.');
    if (Number(p.months) > 0) { const base = s.NextDue && s.NextDue > DEMO.today ? new Date(s.NextDue + 'T00:00:00') : new Date(DEMO.today + 'T00:00:00'); base.setMonth(base.getMonth() + Number(p.months)); s.NextDue = isoD(base); } s.PaymentStatus = 'Paid';
    DEMO.payments.unshift({ Date: p.date, StudentID: s.StudentID, Name: s.Name, Amount: Number(p.amount), Months: Number(p.months), Reference: p.reference || '' });
  } else if (action === 'ska_assign') {
    if (p.link && !/^https?:\/\//i.test(p.link)) return bad('The class link must start with http:// or https://');
    const t = DEMO.teachers.find((x) => x.TeacherID === p.teacherId);
    if (p.teacherId && !t) return bad('Teacher not found.');
    p.studentIds.forEach((id) => { const s = stu(id); if (!s) return; if (t) { s.TeacherID = t.TeacherID; s.Teacher = t.Name; } if (p.level) s.Level = p.level; if (p.startDate) s.StartDate = p.startDate; if (p.nextClass) s.NextClass = p.nextClass; if (p.link) s.ClassLink = p.link; });
  } else if (action === 'ska_curriculum') {
    const info = DEMO.courses.find((c) => c.Course === p.course); if (!info) return bad('Choose the course.');
    const list = Array.isArray(p.rows) ? p.rows : [{ week: p.week, title: p.title, topics: p.topics, remove: p.remove }];
    for (const r of list) { if (!(r.week >= 1 && r.week <= info.Weeks)) return bad('The week must be a number from 1 to ' + info.Weeks + ' for ' + p.course + '.'); if (!r.remove && !r.title) return bad('Week ' + r.week + ' needs a title.'); }
    list.forEach((r) => { DEMO.curriculum = DEMO.curriculum.filter((c) => !(c.Course === p.course && c.Week === r.week)); if (!r.remove) DEMO.curriculum.push({ Course: p.course, Week: r.week, Title: r.title, Topics: r.topics || '' }); });
    DEMO.curriculum.sort((a, b) => a.Course < b.Course ? -1 : a.Course > b.Course ? 1 : a.Week - b.Week);
  } else if (action === 'ska_password') {
    if (String(p.newCode).length < 8) return bad('Your new code must be 8 to 40 characters.');
  } else if (action !== 'ska_login') return bad('Unknown action.');
  return JSON.parse(JSON.stringify(DEMO));
}

(function(){

    document.querySelectorAll('input[type=password]:not([data-eye])').forEach(function(i){
      i.setAttribute('data-eye','1');
      var w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
      var b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show access code');
      b.addEventListener('click',function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide access code':'Show access code');});
      w.appendChild(b);
    });
  }
  deco();new MutationObserver(deco).observe(document.body,{childList:true,subtree:true});
})();
