<!DOCTYPE html>
<html lang="en" class="app staff page-academy-tutor">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor | Himaayah Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#094570">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="top"><div>
<a class="brand" href="index.html"><svg width="22" height="27" viewBox="0 0 377.21 459.6" fill="#094570" aria-hidden="true"><path d="M0.14 280.14c4.28,65.12 98.42,133.97 163.39,172.42 15.86,9.39 34.24,9.39 50.11,-0.01 52.97,-31.37 159.02,-102.63 163.43,-172.41l-376.92 0zm302.67 -162.41l74.4 105.8 0 -126.48c0,-20.52 -11.85,-38.03 -30.9,-45.66l-125.46 -50.22 81.96 116.56zm-228.42 0l82.79 -117.73 -126.49 51.28c-18.95,7.68 -30.7,25.13 -30.7,45.57l0 126.67 74.4 -105.8zm114.21 -8.75c35.22,0 63.77,28.55 63.77,63.77 0,35.22 -28.55,63.77 -63.77,63.77 -35.22,0 -63.77,-28.55 -63.77,-63.77 0,-35.22 28.55,-63.77 63.77,-63.77z"/></svg>Himaayah Schools <em>Academy tutor</em></a>

<main id="login" class="login"><form class="lbox" id="lf" novalidate>
<div class="crest" aria-hidden="true"><svg width="26" height="32" viewBox="0 0 377.21 459.6" fill="#094570"><path d="M0.14 280.14c4.28,65.12 98.42,133.97 163.39,172.42 15.86,9.39 34.24,9.39 50.11,-0.01 52.97,-31.37 159.02,-102.63 163.43,-172.41l-376.92 0zm302.67 -162.41l74.4 105.8 0 -126.48c0,-20.52 -11.85,-38.03 -30.9,-45.66l-125.46 -50.22 81.96 116.56zm-228.42 0l82.79 -117.73 -126.49 51.28c-18.95,7.68 -30.7,25.13 -30.7,45.57l0 126.67 74.4 -105.8zm114.21 -8.75c35.22,0 63.77,28.55 63.77,63.77 0,35.22 -28.55,63.77 -63.77,63.77 -35.22,0 -63.77,-28.55 -63.77,-63.77 0,-35.22 28.55,-63.77 63.77,-63.77z"/></svg></div>
<span class="kick">Academy</span><h1>Tutor login</h1><p>Sign in with the Teacher ID and access code the school gave you.</p>
<div class="demo" id="demoNote" hidden><b>Demo mode.</b> Use ID <b>DEMO</b> and code <b>demo</b> to try it with sample data.</div>
<div class="f"><label for="tid">Teacher ID</label><input id="tid" autocomplete="username" autocapitalize="characters" placeholder="e.g. T-001" required></div>
<div class="f"><label for="tcode">Access code</label><input id="tcode" type="password" autocomplete="new-password" data-lpignore="true" required></div>
<div class="err" id="err" role="alert"></div>
<button class="btn btn-ink" id="go" type="submit">Sign in</button>
</form></main>

<main id="app" class="wrap" hidden></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===== SETTINGS =====
   Same Apps Script web app as the other portals. While it is empty the page runs in DEMO mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';
const KEY = 'hct';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate = (iso, t) => { const d = new Date(iso); return isNaN(d) ? esc(iso || 'Not set') : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) + (t ? ', ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : ''); };
const TABS = [['students', 'Students'], ['mocks', 'Mocks'], ['goals', 'Goals and class'], ['account', 'Account']];
let D = null;
const S = { tab: 'students', q: '', type: 'Daily mock', subject: '', outOf: '100', date: '', sc: {} };

const creds = () => { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null') || {}; } catch (e) { return {}; } };
async function api(action, extra) {
  const c = creds();
  if (!API_URL) return demoApi(c, action, extra || {});
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, id: c.id, code: c.code }, extra || {})) });
  return r.json();
}
let toastT;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 5000 : 3000); }
let busy = false;
async function act(action, extra, okMsg, btn) {
  if (busy) return false;
  busy = true; const old = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const d = await api(action, extra);
    if (d.ok) { D = d; if (okMsg) toast(okMsg); render(); return true; }
    toast(d.error || 'Could not save. Please try again.', true);
  } catch (e) { toast('Could not reach the school server. Please try again.', true); }
  finally { busy = false; if (btn && document.contains(btn)) { btn.disabled = false; btn.textContent = old; } }
  return false;
}

/* ---------- helpers ---------- */
const today = () => D.today;
const sd = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const examIn = (s) => { if (!s.ExamDate) return ''; const n = Math.round((new Date(s.ExamDate + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5); return n < 0 ? 'exam done' : n + ' days to exam'; };
const readState = (s) => { const r = s.Reading || {}; if (!r.Target) return { t: s.IsUtme ? 'No target set' : 'No target', c: s.IsUtme ? 'p-over' : 'p-wash' }; return { t: r.Done + '/' + r.Target + ' ' + D.readingUnit, c: r.Done >= r.Target ? 'p-ink' : 'p-sky' }; };
const noTarget = () => D.students.filter((s) => s.IsUtme && !(s.Reading && s.Reading.Target));

/* ---------- views ---------- */
function vStudents() {
  const row = (s) => { const rs = readState(s), l = s.Last;
    return `<details class="box stu" data-name="${esc((s.Name + ' ' + s.StudentID).toLowerCase())}">
    <summary><div><b>${esc(s.Name)}</b><small>${esc(s.Track || 'Academy')}${s.Group ? ' · ' + esc(s.Group) : ''}${s.ExamDate ? ' · ' + examIn(s) : ''}</small></div><div class="sum-r"><span class="pill ${l ? 'p-ink' : 'p-wash'}">${l ? l.Percent + '%' : 'No mock'}</span><span class="pill ${rs.c}">${esc(rs.t)}</span></div></summary>
    <div class="body"><div class="tiles" style="grid-template-columns:repeat(3,1fr)"><div class="tile"><b>${s.Sittings || 0}</b><span>mock sittings</span></div><div class="tile"><b>${s.Avg5 != null && s.Sittings ? s.Avg5 + '%' : '–'}</b><span>average, last 5</span></div><div class="tile"><b>${s.TargetPercent ? s.TargetPercent + '%' : '–'}</b><span>target</span></div></div>
      <p class="sub">${l ? 'Latest: ' + esc(l.Type) + ', ' + fdate(l.Date) + ' (' + l.Percent + '%).' : 'No mock recorded yet.'}${s.ExamDate ? ' Exam: ' + fdate(s.ExamDate) + '.' : ''}${s.NextClass ? ' Next class: ' + fdate(s.NextClass, true) + '.' : ''}${D.teacher.Role === 'Admin' && s.PaymentStatus ? ' Payment: ' + esc(s.PaymentStatus) + '.' : ''}</p>
      ${s.Reading && s.Reading.History && s.Reading.History.length ? `<p class="sub">Reading, last weeks: ${s.Reading.History.slice(-6).map((h) => h.Done + '/' + h.Target).join(', ')}</p>` : ''}
      ${s.Wa ? `<p class="sub"><a class="lnk" href="https://wa.me/${esc(s.Wa)}" target="_blank" rel="noopener">Message on WhatsApp</a></p>` : ''}</div></details>`; };
  const nt = noTarget(), withMock = D.students.filter((s) => s.Last).length;
  return `<article class="c w12"><h2>Your students</h2>${nt.length ? `<div class="demo" style="margin-bottom:14px"><b>${nt.length} UTME student${nt.length === 1 ? ' has' : 's have'} no reading target this week:</b> ${nt.map((s) => esc(s.Name)).join(', ')}. The reading club is compulsory for UTME.</div>` : ''}
    <div class="tiles"><div class="tile"><b>${D.students.length}</b><span>students</span></div><div class="tile"><b>${withMock}</b><span>have a mock</span></div><div class="tile ${nt.length ? 'warn' : ''}"><b>${nt.length}</b><span>UTME, no reading target</span></div></div>
    <input class="in" id="q" type="search" placeholder="Search by name or ID" value="${esc(S.q)}" style="max-width:340px">
    <div id="stulist">${D.students.map(row).join('') || '<p class="empty" style="margin-top:12px">No Academy students are assigned to you yet.</p>'}</div></article>`;
}

function vMocks() {
  const date = S.date || today();
  return `<article class="c w12"><h2>Record a mock</h2><p class="sub">Choose the mock, then enter each student’s score for one subject. Leave a score empty to skip a student. Entering the same student, date, type and subject again corrects the earlier score.</p>
  <form class="frm" data-form="mock">
    <div class="row3"><div><label class="fl" for="mt">Type</label><select class="in" id="mt" name="type">${D.types.map((t) => `<option${t === S.type ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div><label class="fl" for="md">Date</label><input class="in" id="md" name="date" type="date" value="${esc(date)}" max="${esc(today())}" required></div>
      <div><label class="fl" for="mo">Out of</label><input class="in" id="mo" name="outOf" type="number" min="1" max="1000" step="any" inputmode="decimal" value="${esc(S.outOf)}" required></div></div>
    <div><label class="fl" for="ms">Subject</label><input class="in" id="ms" name="subject" list="subj" maxlength="40" placeholder="e.g. Mathematics" value="${esc(S.subject)}" autocomplete="off" required style="max-width:340px"><datalist id="subj">${D.subjects.map((x) => `<option value="${esc(x)}">`).join('')}</datalist></div>
    ${D.students.length ? `<div class="scores">${D.students.map((s) => `<div><span><b>${esc(s.Name)}</b><br><small style="color:var(--muted)">${esc(s.Track || '')}</small></span><input class="in" name="sc-${esc(s.StudentID)}" type="number" min="0" step="any" inputmode="decimal" aria-label="Score for ${esc(s.Name)}" value="${esc(S.sc[s.StudentID] ?? '')}"></div>`).join('')}</div>
    <button class="btn btn-ink" type="submit">Save scores</button>` : '<p class="empty">No Academy students are assigned to you yet.</p>'}</form></article>`;
}

function vGoals() {
  const pick = (n) => `<div class="pick" id="${n}">${D.students.map((s) => `<label><input type="checkbox" value="${esc(s.StudentID)}"> <span>${esc(s.Name)}</span><small>${esc(s.Track || '')}</small></label>`).join('') || '<p class="empty">No students yet.</p>'}</div>
    <div class="tool"><button class="btn btn-line btn-sm" type="button" data-act="all" data-t="${n}">Select all</button><button class="btn btn-line btn-sm" type="button" data-act="none" data-t="${n}">Clear</button></div>`;
  return `<div class="grid"><article class="c w6"><h2>Exam date and target</h2><p class="sub">Applies to the students you tick. Leave a field empty to keep what is already there.</p>
    <form class="frm" data-form="goals"><div class="row2"><div><label class="fl" for="ge">Exam date</label><input class="in" id="ge" name="examDate" type="date"></div><div><label class="fl" for="gt">Target score (%)</label><input class="in" id="gt" name="target" type="number" min="1" max="100" step="any" inputmode="decimal" placeholder="e.g. 75"></div></div>
    <label class="fl">Students</label>${pick('gp')}<button class="btn btn-ink" type="submit">Save</button></form></article>
  <article class="c w6"><h2>Next live class</h2><p class="sub">Shown on each ticked student’s dashboard with a join button.</p>
    <form class="frm" data-form="class"><div><label class="fl" for="cn">Date and time</label><input class="in" id="cn" name="nextClass" type="datetime-local"></div><div><label class="fl" for="cl">Join link</label><input class="in" id="cl" name="link" type="url" placeholder="https://meet.google.com/..."></div>
    <label class="fl">Students</label>${pick('cp')}<button class="btn btn-ink" type="submit">Save class</button></form></article></div>`;
}

function vAccount() {
  return `<article class="c w12" style="max-width:560px"><h2>Your account</h2><p class="sub">${esc(D.teacher.Name)} · ${esc(D.teacher.TeacherID)} · ${esc(D.teacher.Role)}</p>
  <form class="frm" data-form="password"><div><label class="fl" for="np">New access code (8 characters or more)</label><input class="in" id="np" name="newCode" type="password" autocomplete="new-password" minlength="8" maxlength="40"></div>
  <div><label class="fl" for="np2">Type it again</label><input class="in" id="np2" name="again" type="password" autocomplete="new-password"></div>
  <button class="btn btn-ink" type="submit">Change my code</button></form></article>`;
}

const VIEWS = { students: vStudents, mocks: vMocks, goals: vGoals, account: vAccount };
function render() {
  const nt = noTarget().length;
  $('app').innerHTML = `<section class="greet"><div><small>Assalaamu alaykum</small><h1>${esc(D.teacher.Name)}</h1>
    <div class="chips"><span>${esc(D.teacher.Role)}</span><span>${D.students.length} student${D.students.length === 1 ? '' : 's'}</span>${nt ? `<span>${nt} UTME without a reading target</span>` : ''}</div></div></section>
  <nav class="tabs" role="tablist" aria-label="Sections">${TABS.map(([k, l]) => `<button role="tab" type="button" data-act="tab" data-t="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</nav>
  <div id="view">${VIEWS[S.tab]()}</div>
  <p class="foot">${API_URL ? '' : 'Demo mode: sample data, nothing is saved. '}Students see their mocks, reading and class details on their own dashboard.</p>`;
  applyFilter();
}
function applyFilter() { const q = S.q.trim().toLowerCase(); document.querySelectorAll('#stulist [data-name]').forEach((el) => { el.hidden = !!q && el.dataset.name.indexOf(q) < 0; }); }

/* ---------- events ---------- */
const app = $('app');
const ticked = (id) => [...document.querySelectorAll('#' + id + ' input:checked')].map((x) => x.value);
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { S.tab = b.dataset.t; render(); window.scrollTo(0, 0); }
  else if (a === 'all' || a === 'none') document.querySelectorAll('#' + b.dataset.t + ' input').forEach((x) => { x.checked = a === 'all'; });
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; applyFilter(); }
  else if (t.name && t.name.indexOf('sc-') === 0) S.sc[t.name.slice(3)] = t.value;
  else if (t.id === 'ms') S.subject = t.value; else if (t.id === 'mo') S.outOf = t.value; else if (t.id === 'mt') S.type = t.value; else if (t.id === 'md') S.date = t.value;
});
app.addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form, v = (n) => f.elements[n] ? f.elements[n].value : '', btn = f.querySelector('button[type=submit]');
  if (k === 'mock') {
    const outOf = Number(v('outOf')), subject = v('subject').trim();
    if (!subject) return toast('Enter the subject.', true);
    if (!(outOf > 0)) return toast('Enter what the mock was out of.', true);
    const scores = D.students.map((s) => ({ studentId: s.StudentID, score: v('sc-' + s.StudentID).trim() })).filter((x) => x.score !== '');
    if (!scores.length) return toast('Enter at least one score.', true);
    const over = scores.find((x) => !(Number(x.score) >= 0 && Number(x.score) <= outOf));
    if (over) return toast('Each score must be between 0 and ' + outOf + '.', true);
    const ok = await act('acdt_mock', { subject, type: v('type'), date: v('date'), outOf, scores }, scores.length + ' score' + (scores.length === 1 ? '' : 's') + ' saved for ' + subject + '.', btn);
    if (ok) { S.sc = {}; S.subject = ''; render(); }
  } else if (k === 'goals') {
    const ids = ticked('gp'); if (!ids.length) return toast('Tick at least one student.', true);
    if (!v('examDate') && !v('target').trim()) return toast('Enter an exam date or a target score.', true);
    const t = v('target').trim(); if (t && !(Number(t) >= 1 && Number(t) <= 100)) return toast('The target is a percentage from 1 to 100.', true);
    act('acdt_goals', { studentIds: ids, examDate: v('examDate'), target: t }, 'Saved for ' + ids.length + ' student' + (ids.length === 1 ? '' : 's') + '.', btn);
  } else if (k === 'class') {
    const ids = ticked('cp'); if (!ids.length) return toast('Tick at least one student.', true);
    if (!v('nextClass') && !v('link').trim()) return toast('Enter a date and time, or a link.', true);
    act('acdt_class', { studentIds: ids, nextClass: v('nextClass'), link: v('link').trim() }, 'Class saved.', btn);
  } else if (k === 'password') {
    if (v('newCode').length < 8) return toast('Your new code must be at least 8 characters.', true);
    if (v('newCode') !== v('again')) return toast('The two codes do not match.', true);
    const code = v('newCode');
    act('acdt_password', { newCode: code }, 'Code changed.', btn).then((ok) => { if (ok) sessionStorage.setItem(KEY, JSON.stringify({ id: creds().id, code })); });
  }
});

/* ---------- login ---------- */
function showApp() { $('login').hidden = true; app.hidden = false; $('out').hidden = false; render(); window.scrollTo(0, 0); }
async function signIn(id, code, silent) {
  const btn = $('go'), err = $('err'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  sessionStorage.setItem(KEY, JSON.stringify({ id, code }));
  try {
    const d = await api('acdt_login');
    if (d.ok) { D = d; showApp(); } else { sessionStorage.removeItem(KEY); if (!silent) err.textContent = d.error || 'Could not sign in.'; }
  } catch (e) { sessionStorage.removeItem(KEY); if (!silent) err.textContent = 'Could not reach the school server. Please try again.'; }
  btn.disabled = false; btn.textContent = 'Sign in';
}
$('demoNote').hidden = !!API_URL;
$('lf').addEventListener('submit', (e) => { e.preventDefault(); const id = $('tid').value.trim(), code = $('tcode').value.trim(); if (!id || !code) { $('err').textContent = 'Enter your ID and access code.'; return; } signIn(id, code); });
$('out').addEventListener('click', () => { sessionStorage.removeItem(KEY); D = null; S.tab = 'students'; S.sc = {}; app.hidden = true; app.innerHTML = ''; $('out').hidden = true; $('login').hidden = false; $('tcode').value = ''; });

/* ---------- demo mode (only used while API_URL is empty) ---------- */
let DEMO = null;
const isoD = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const plus = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
function demoBase() {
  const mon = isoD(plus(-((new Date().getDay() + 6) % 7)));
  const st = (id, name, track, utme, last, avg, n, tgt, exam, read) => ({ StudentID: id, Name: name, Track: track, Group: 'Batch 1', IsUtme: utme, ExamDate: exam, TargetPercent: tgt, NextClass: '', ClassLink: '', Wa: '', PaymentStatus: '', Sittings: n, Last: last, Avg5: avg, Reading: read });
  return { ok: true, today: isoD(new Date()), teacher: { TeacherID: 'DEMO', Name: 'Ustadh Demo', Role: 'Tutor' },
    students: [st('HM-0201', 'Fatima Yusuf', 'UTME', true, { Date: isoD(plus(-1)), Type: 'Daily mock', Percent: 66 }, 61.4, 7, 75, isoD(plus(96)), { Week: mon, Target: 60, Done: 25, History: [{ Week: isoD(plus(-7)), Target: 50, Done: 52 }] }),
      st('HM-0202', 'Ibrahim Salaudeen', 'UTME', true, { Date: isoD(plus(-3)), Type: 'Weekly mock', Percent: 52 }, 49, 4, 70, isoD(plus(96)), { Week: mon, Target: 0, Done: 0, History: [] }),
      st('HM-0203', 'Zainab Oladipo', 'O-Levels', false, null, null, 0, '', '', { Week: mon, Target: 0, Done: 0, History: [] })],
    types: ['Daily mock', 'Weekly mock'], subjects: ['English', 'Mathematics', 'Physics', 'Chemistry', 'Biology'], readingUnit: 'pages', week: mon };
}
async function demoApi(c, action, p) {
  await new Promise((r) => setTimeout(r, 120));
  if (String(c.id || '').toUpperCase() !== 'DEMO' || c.code !== 'demo') return { ok: false, error: 'Wrong ID or access code.' };
  if (!DEMO) DEMO = demoBase();
  const bad = (m) => ({ ok: false, error: m }), stu = (id) => DEMO.students.find((s) => s.StudentID === id);
  if (action === 'acdt_mock') {
    if (!p.subject) return bad('Enter the subject.');
    if (p.date > DEMO.today) return bad('Choose a valid date that is not in the future.');
    p.scores.forEach((x) => { const s = stu(x.studentId); if (!s) return; const pc = Math.round(1000 * Number(x.score) / p.outOf) / 10; s.Last = { Date: p.date, Type: p.type, Percent: pc }; s.Sittings += 1; s.Avg5 = Math.round(10 * ((s.Avg5 || pc) * Math.min(s.Sittings - 1, 4) + pc) / Math.min(s.Sittings, 5)) / 10; });
  } else if (action === 'acdt_goals') {
    p.studentIds.forEach((id) => { const s = stu(id); if (p.examDate) s.ExamDate = p.examDate; if (p.target !== '') s.TargetPercent = Number(p.target); });
  } else if (action === 'acdt_class') {
    if (p.link && !/^https?:\/\//i.test(p.link)) return bad('The class link must start with http:// or https://');
    p.studentIds.forEach((id) => Object.assign(stu(id), { NextClass: p.nextClass, ClassLink: p.link }));
  } else if (action === 'acdt_password') { if (String(p.newCode).length < 8) return bad('Your new code must be 8 to 40 characters.');
  } else if (action !== 'acdt_login') return bad('Unknown action.');
  return JSON.parse(JSON.stringify(DEMO));
}
</script>
<script>
/* Show/hide toggle on every access-code box */
(function(){
  function deco(){
    document.querySelectorAll('input[type=password]:not([data-eye])').forEach(function(i){
      i.setAttribute('data-eye','1');
      var w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
      var b=document.createElement('button');b.type='button';b.textContent='Show';b.setAttribute('aria-label','Show access code');
