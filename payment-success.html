<style>
  :root { --deep: #062F4D; --ink: #094570; --sky: #85CCFF; --wash: #F1F7FC; --muted: #55697B; --display: 'Bricolage Grotesque', 'Inter', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .card { position: relative; max-width: 520px; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }

  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 5.4vw, 60px); line-height: 1.05; letter-spacing: -.025em; margin-bottom: 16px; }

  a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  @keyframes pop { from { transform: scale(0); } }
