<!DOCTYPE html>
<html lang="en" class="app page-library">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madrasah Library | Himaayah Schools</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#094570">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top"><div>
<a class="brand" href="index.html"><svg width="22" height="27" viewBox="0 0 377.21 459.6" fill="#094570" aria-hidden="true"><path d="M0.14 280.14c4.28,65.12 98.42,133.97 163.39,172.42 15.86,9.39 34.24,9.39 50.11,-0.01 52.97,-31.37 159.02,-102.63 163.43,-172.41l-376.92 0zm302.67 -162.41l74.4 105.8 0 -126.48c0,-20.52 -11.85,-38.03 -30.9,-45.66l-125.46 -50.22 81.96 116.56zm-228.42 0l82.79 -117.73 -126.49 51.28c-18.95,7.68 -30.7,25.13 -30.7,45.57l0 126.67 74.4 -105.8zm114.21 -8.75c35.22,0 63.77,28.55 63.77,63.77 0,35.22 -28.55,63.77 -63.77,63.77 -35.22,0 -63.77,-28.55 -63.77,-63.77 0,-35.22 28.55,-63.77 63.77,-63.77z"/></svg>Himaayah Schools <em>Library</em></a>
<nav><a class="btn btn-line" href="dashboard.html">My dashboard</a><button class="btn btn-ink" id="out" hidden>Log out</button></nav>
</div></header>

<main id="login" class="login"><form class="lbox" id="lf" novalidate>
<div class="crest" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#094570" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5v-2z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/><path d="M9 7h6"/></svg></div>
<span class="kick">Students</span><h1>Madrasah library</h1><p>Books, notes and links for Himaayah students. Sign in with your Student ID and access code.</p>
<div class="demo" id="demoNote" hidden><b>Demo mode.</b> Use ID <b>DEMO</b> and code <b>demo</b> to see sample items.</div>
<div class="f"><label for="sid">Student ID</label><input id="sid" autocomplete="username" autocapitalize="characters" required></div>
<div class="f"><label for="scode">Access code</label><input id="scode" type="password" autocomplete="current-password" required></div>
<div class="err" id="err" role="alert"></div><button class="btn btn-ink" id="go" type="submit">Sign in</button>
<div class="lnote">Signed in on your dashboard already? You'll go straight in.</div>
</form></main>

<main id="app" hidden></main>

<script>
/* Paste your Apps Script web-app URL (the same one as dashboard.html). While empty, the page runs in DEMO mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycby0AsifBuB_Ad7g1SjDXCipaDU27-BrzYWf67muw5jeY_C0_0uz8AhQYYXdiNRQhvqX/exec';

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = { student: null, items: [], q: '', subject: 'All', type: 'All', all: false, sort: 'new' };
const safeUrl = (u) => /^https:\/\/[^\s]+$/i.test(String(u || '')) ? u : '#';

/* ---- demo data (only while API_URL is empty) ---- */
function demo() {
  const d = (n) => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
  const it = (Title, Author, Type, Subject, Level, Description, ago, forMe) => ({ Title, Author, Type, Subject, Level, Url: 'https://example.com/sample', Description, Added: d(ago), forMe });
  return { ok: true, student: { name: 'Sample Student', level: 'Thālithah Ibtidā’iyyah' }, items: [
    it('Sample: Forty Hadith revision notes', 'Himaayah teachers', 'PDF', 'Hadith', 'All', 'Your teachers\u2019 own notes. Items like this appear when staff add them to the sheet.', 3, true),
    it('Sample: Tajweed rules at a glance', 'Himaayah teachers', 'PDF', 'Tajweed', 'All', 'A one-page summary to keep beside you when you recite.', 12, true),
    it('Sample: Arabic reading practice', 'Himaayah teachers', 'PDF', 'Arabic', 'Thālithah Ibtidā’iyyah', 'Practice sheets for your level.', 40, true),
    it('Sample: Link to a trusted tafsir website', '', 'Link', 'Fiqh', 'All', 'Links to other websites open in a new tab.', 80, true),
    it('Sample: Beginner Arabic letters workbook', 'Himaayah teachers', 'PDF', 'Arabic', 'Rawdah', 'For students in a lower level. Hidden unless you choose "Show other levels too".', 90, false),
    it('Sample: Iʿdādiyyah reading list', 'Himaayah teachers', 'Book', 'Aqeedah', 'Awwal Iʿdādiyyah', 'For students in a higher level.', 120, false) ] };
}
async function api(id, code) {
  if (!API_URL) { await new Promise((r) => setTimeout(r, 350)); return id.toUpperCase() === 'DEMO' && code === 'demo' ? demo() : { ok: false, error: 'Wrong ID or access code.' }; }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'library', id, code }) });
  return r.json();
}

/* ---- view ---- */
const isNew = (a) => { const t = Date.parse(a); return !isNaN(t) && (Date.now() - t) / 864e5 <= 30; };
const byNewest = (a, b) => String(b.Added).localeCompare(String(a.Added));
const typeOk = (x) => ST.type === 'All' || (ST.type === 'Books' ? x.Type !== 'Link' : x.Type === 'Link');
const scopeOk = (x) => ST.all || x.forMe;
function visible() {
  const q = ST.q.trim().toLowerCase();
  return ST.items.filter((x) => scopeOk(x) && typeOk(x) && (ST.subject === 'All' || x.Subject === ST.subject)
    && (!q || (x.Title + ' ' + x.Author + ' ' + x.Description + ' ' + x.Subject).toLowerCase().includes(q)))
    .sort((a, b) => ST.sort === 'az' ? String(a.Title).localeCompare(String(b.Title)) : byNewest(a, b));
}
const GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Website"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>';
const tile = (x) => x.Type === 'Link' ? `<div class="tile">${GLOBE}</div>` : `<div class="tile">${x.Type === 'Book' ? 'BOOK' : 'PDF'}</div>`;
const label = (x) => x.Type === 'Link' ? 'Visit site' : x.Type === 'Book' ? 'Read' : 'Open PDF';
const link = (x, cls) => `<a class="btn ${cls}" href="${esc(safeUrl(x.Url))}" target="_blank" rel="noopener noreferrer">${label(x)}</a>`;
const lvl = (x) => x.Level === 'All' || !x.Level ? '<span class="lv">All levels</span>' : `<span class="lv mine">${esc(x.Level)}</span>`;

function main() {
  const l = visible();
  const feat = (!ST.q.trim() && ST.subject === 'All' && ST.type === 'All') ? l.filter((x) => isNew(x.Added)).sort(byNewest).slice(0, 2) : [];
  const fHtml = feat.length ? `<section><h2>New this month</h2><div class="fgrid">${feat.map((x) => `<article class="feat"><div class="top2">${tile(x)}<span class="newp">New</span></div>
      <h3>${esc(x.Title)}</h3><div class="by">${esc([x.Author, x.Subject].filter(Boolean).join(' \u00B7 '))}</div><p class="d">${esc(x.Description)}</p>${link(x, 'btn-sky')}</article>`).join('')}</div></section>` : '';
  const rows = l.length ? `<div class="list">${l.map((x, i) => `<article class="item ${x.forMe ? '' : 'other'}" style="--i:${Math.min(i, 12)}">${tile(x)}
      <div class="txt"><h3>${esc(x.Title)}</h3><div class="by">${esc([x.Author, x.Subject].filter(Boolean).join(' \u00B7 '))}</div><p class="d">${esc(x.Description)}</p></div>
      <div class="act">${isNew(x.Added) ? '<span class="nm">New</span>' : ''}${lvl(x)}${link(x, 'btn-ink')}</div></article>`).join('')}</div>`
    : '<div class="empty">Nothing matches. Try another subject or format, or choose "Show other levels too" to see the whole library.</div>';
  $('main').innerHTML = `${fHtml}<section><div class="head"><h2>All materials <small>${l.length} item${l.length === 1 ? '' : 's'}</small></h2>
    <button class="sortbtn" data-sort="${ST.sort === 'new' ? 'az' : 'new'}">Sort: ${ST.sort === 'new' ? 'newest first' : 'A to Z'}</button></div><div aria-live="polite">${rows}</div></section>`;
}
function page() {
  const pool = ST.items.filter((x) => scopeOk(x) && typeOk(x));
  const counts = {}; pool.forEach((x) => { counts[x.Subject] = (counts[x.Subject] || 0) + 1; });
  const subs = Object.keys(counts).sort();
  const subBtn = (k, name, n) => `<button data-sub="${esc(k)}" aria-pressed="${ST.subject === k}"><span>${esc(name)}</span><span>${n}</span></button>`;
  $('app').innerHTML = `<div class="wrap">
    <p class="greet">Assalaamu alaykum, ${esc(String(ST.student.name).split(' ')[0])}</p><h1>Your Madrasah library</h1>
    <div class="intro"><p>Books, notes and links chosen by your teachers.</p><span class="chip">Showing: ${ST.all ? 'all levels' : esc(ST.student.level || 'your level') + ' and all levels'}</span></div>
    <div class="layout"><aside class="rail" aria-label="Filters">
      <div><label for="q">Search</label><input id="q" type="search" placeholder="Title, author or subject" value="${esc(ST.q)}"></div>
      <div><span class="lbl">Subject</span><div class="subjects">${subBtn('All', 'All subjects', pool.length)}${subs.map((s) => subBtn(s, s, counts[s])).join('')}</div></div>
      <div><span class="lbl">Format</span><div class="formats">${[['All', 'Everything'], ['Books', 'PDFs and books'], ['Links', 'Websites']].map(([k, t]) => `<button data-type="${k}" aria-pressed="${ST.type === k}">${t}</button>`).join('')}</div></div>
      <div class="levels"><button data-all aria-pressed="${ST.all}">${ST.all ? 'Showing all levels' : 'Show other levels too'}</button></div>
    </aside><div class="main" id="main"></div></div>
    <p class="foot2">For Himaayah students only. Please do not share these materials. Some links lead to other websites.</p></div>`;
  main();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-sub],[data-type],[data-all],[data-sort]'); if (!t || !ST.student) return;
  if (t.dataset.sort) { ST.sort = t.dataset.sort; main(); return; }
  if (t.dataset.sub !== undefined) ST.subject = t.dataset.sub; else if (t.dataset.type) ST.type = t.dataset.type; else ST.all = !ST.all;
  if (ST.subject !== 'All' && !ST.items.some((x) => x.Subject === ST.subject && scopeOk(x) && typeOk(x))) ST.subject = 'All';
  page();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { ST.q = e.target.value; main(); } });

/* ---- sign in (shares the dashboard's session, so a student who just signed in there is already in) ---- */
function enter(d, id, code) { sessionStorage.setItem('hs', JSON.stringify({ id, code })); Object.assign(ST, { student: d.student, items: d.items || [] }); $('login').hidden = true; $('app').hidden = false; $('out').hidden = false; page(); window.scrollTo(0, 0); }
async function signIn(id, code, silent) {
  const b = $('go'); $('err').textContent = ''; b.disabled = true; b.textContent = 'Signing in…';
  try { const d = await api(id, code); if (d.ok) enter(d, id, code); else if (!silent) $('err').textContent = d.error || 'Could not sign in.'; else sessionStorage.removeItem('hs'); }
  catch (x) { if (!silent) $('err').textContent = 'Could not reach the school server. Please try again.'; }
  b.disabled = false; b.textContent = 'Sign in';
}
$('demoNote').hidden = !!API_URL;
$('lf').addEventListener('submit', (e) => { e.preventDefault(); const i = $('sid').value.trim(), c = $('scode').value.trim(); if (!i || !c) { $('err').textContent = 'Enter your Student ID and access code.'; return; } signIn(i, c); });
$('out').addEventListener('click', () => { sessionStorage.removeItem('hs'); location.reload(); });
try { const s = JSON.parse(sessionStorage.getItem('hs') || 'null'); if (s && s.id && s.code) signIn(s.id, s.code, true); } catch (x) {}
</script>
</body>
</html>
