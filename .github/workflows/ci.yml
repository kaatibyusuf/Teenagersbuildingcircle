name: CI

# Runs on every push and every pull request. A red cross means: do not merge, do not deploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (backend .gs files and every inline script in the pages)
        run: npm run lint
      - name: Tests (scoring, question bank, weekly mock build)
        run: npm test
